<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>★お絵描き</title>

  <!-- PWA & iOS Safari フルスクリーン対応設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="★お絵描き">
  <meta name="theme-color" content="#020617">
  
  <!-- PWA Web App Manifest (Data URI形式で直接埋め込み) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"★お絵描き","short_name":"★お絵描き","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617"}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 全画面バウンス・スクロールの徹底防止 */
    html, body {
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
    }

    /* キャンバス領域のタッチ操作最適化 */
    canvas {
      touch-action: none;
      cursor: crosshair;
    }

    /* スクロール可能なエリア（モーダル用） */
    .scrollable-content {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    /* ランキング順位変更時の移動アニメーション */
    .player-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="h-[100dvh] w-vw flex flex-col justify-between font-sans overflow-hidden">

  <!-- ========================================== -->
  <!-- 1. テレビに映るメイン領域（Top 3.9% 〜 Bottom 18.1%） -->
  <!-- ========================================== -->
  <div class="flex-1 flex flex-col pt-[3.9dvh] px-[0.7vw] pb-1 min-h-0 relative">
    <div class="w-full h-full flex flex-row gap-2 min-h-0">
      
      <!-- テレビ左側：プレイヤーランキング縦並び（リアルタイム順位ソート＆高さ自動フィット） -->
      <aside id="tv-rankings-container" class="w-44 md:w-56 h-full flex flex-col gap-1.5 shrink-0">
        <!-- JavaScriptで動的生成されます -->
      </aside>

      <!-- テレビ中央〜右側：タイマーバー ＆ お絵描きキャンバス -->
      <main class="flex-1 h-full flex flex-col gap-1.5 min-h-0 min-w-0">
        
        <!-- YouTube風 タイマープログレスバー -->
        <div class="w-full bg-slate-800/80 rounded-full h-4 overflow-hidden border border-slate-700 relative shrink-0 shadow-inner">
          <div id="timer-progress-bar" class="h-full bg-gradient-to-r from-red-600 via-rose-500 to-amber-500 rounded-full transition-all duration-200 ease-linear w-full"></div>
          <span id="timer-text-overlay" class="absolute inset-0 flex items-center justify-center text-[11px] font-black text-white drop-shadow font-mono">
            01:00
          </span>
        </div>

        <!-- キャンバス容器 -->
        <div id="canvas-container" class="flex-1 w-full relative bg-white rounded-2xl overflow-hidden shadow-2xl border-2 border-slate-800 min-h-0">
          <canvas id="paint-canvas" class="w-full h-full"></canvas>
        </div>
      </main>

    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. テレビには絶対映らない秘密の領域（画面最下部 18.1%固定） -->
  <!-- ========================================== -->
  <footer class="h-[18.1dvh] w-full bg-slate-900 border-t-2 border-slate-700 px-3 py-1.5 flex items-center justify-between gap-2 shrink-0 z-20 shadow-2xl overflow-hidden">
    
    <!-- お題表示（テレビ非表示・描き手用） -->
    <div class="flex-1 bg-amber-500/10 border-2 border-amber-500/50 rounded-xl px-3 py-1 flex flex-col justify-between relative shadow-inner h-full overflow-hidden">
      <div class="flex items-center justify-between">
        <span class="bg-amber-600 text-white text-[9px] font-bold px-1.5 py-0.2 rounded">
          テレビ非表示（お題）
        </span>
        <span class="text-[9px] text-slate-400">正解したら画面左のプレイヤーをタップ！</span>
      </div>
      <div id="word-display" class="text-lg md:text-2xl font-black tracking-wider text-amber-300 truncate text-center my-auto">
        「スタート」を押してね！
      </div>
    </div>

    <!-- 描き手用 ツール＆コントロール（テレビ非表示・完全に収まるコンパクト設計） -->
    <div class="h-full flex flex-col justify-between py-0.5 space-y-1 shrink-0">
      
      <!-- 描画ツール -->
      <div class="flex items-center space-x-1.5 bg-slate-950 border border-slate-700 p-1 rounded-lg">
        <button id="tool-pen" onclick="setTool('pen')" class="px-3 py-1.5 rounded font-bold text-xs bg-indigo-600 text-white border border-indigo-400 shadow">
          ✏️ ペン
        </button>
        <button id="tool-eraser" onclick="setTool('eraser')" class="px-3 py-1.5 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">
          🧹 消しゴム
        </button>
        <button onclick="clearCanvas()" class="px-2.5 py-1.5 rounded font-bold text-xs bg-rose-900/80 hover:bg-rose-800 text-rose-200 border border-rose-700">
          🗑️ 全消し
        </button>
      </div>

      <!-- ゲーム進行＆設定ボタン -->
      <div class="flex items-center justify-end space-x-1.5">
        <button id="btn-skip" onclick="skipWord()" disabled class="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-white font-bold py-1.5 px-3 rounded text-xs border border-slate-600">
          パス
        </button>
        <button id="btn-start" onclick="toggleGame()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-4 rounded text-xs md:text-sm border border-emerald-400 shadow">
          スタート
        </button>
        <button onclick="openSettings()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded border border-slate-700 text-xs">
          ⚙️ 設定
        </button>
      </div>
    </div>
  </footer>


  <!-- ========================================== -->
  <!-- 3. モーダル：設定＆プレイヤー・お題登録画面 -->
  <!-- ========================================== -->
  <div id="settings-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl">
      <!-- ヘッダー -->
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-xl font-bold text-white flex items-center space-x-2">
          <span>⚙️ ゲーム設定＆お題登録</span>
        </h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-2xl font-bold px-2">✕</button>
      </div>

      <!-- コンテンツ -->
      <div class="p-6 scrollable-content overflow-y-auto space-y-6 flex-1 text-sm">
        
        <!-- タブボタン -->
        <div class="flex space-x-2 border-b border-slate-800 pb-2">
          <button id="tab-btn-players" onclick="switchTab('players')" class="px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white">
            👥 プレイヤー＆順位
          </button>
          <button id="tab-btn-words" onclick="switchTab('words')" class="px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400">
            📝 お題一括登録
          </button>
        </div>

        <!-- タブ1: プレイヤー管理 -->
        <div id="tab-content-players" class="space-y-4">
          <div class="flex justify-between items-center">
            <p class="text-slate-400 text-xs">
              参加するプレイヤーをONにし、名前を設定してください（最大9名）。
            </p>
            <button onclick="resetScores()" class="text-xs bg-rose-900/50 hover:bg-rose-800 text-rose-300 border border-rose-700 px-3 py-1 rounded">
              スコアをリセット
            </button>
          </div>

          <div id="players-list-container" class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- 動的生成 -->
          </div>
        </div>

        <!-- タブ2: お題登録 -->
        <div id="tab-content-words" class="space-y-3 hidden">
          <p class="text-slate-400 text-xs">
            1行に1つの「お題」を入力・ペーストしてください。
          </p>
          <textarea id="words-input" rows="10" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-mono text-sm focus:outline-none focus:border-indigo-500" placeholder="リンゴ&#10;ゴリラ&#10;ラッパ"></textarea>
          <div class="flex justify-between items-center text-xs text-slate-500">
            <span id="words-count-display">現在のお題数: 0個</span>
            <button onclick="loadDefaultWords()" class="text-indigo-400 hover:underline">デフォルトのお題を読み込む</button>
          </div>
        </div>

      </div>

      <!-- フッター -->
      <div class="p-4 border-t border-slate-800 flex justify-end">
        <button onclick="saveAndCloseSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2 rounded-xl shadow-lg">
          設定を保存して閉じる
        </button>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 4. モーダル：タイムアップ・ラウンド結果画面 -->
  <!-- ========================================== -->
  <div id="result-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-500/50 rounded-2xl w-full max-w-md p-6 text-center shadow-2xl space-y-5">
      <div class="text-5xl">⏰</div>
      <h2 class="text-3xl font-black text-amber-400">タイムアップ！</h2>
      <p class="text-slate-300 text-sm">1分間の挑戦が終了しました！</p>

      <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-slate-400 border-b border-slate-800 pb-1">🏆 最終ランキング</h3>
        <div id="result-ranking-list" class="space-y-2 max-h-48 scrollable-content overflow-y-auto pr-1">
          <!-- 動的生成 -->
        </div>
      </div>

      <button onclick="closeResultModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg text-lg">
        次のラウンドへ！
      </button>
    </div>
  </div>


  <!-- JavaScript ロジック -->
  <script>
    const DEFAULT_WORDS = [
      "リンゴ", "富士山", "ドラえもん", "サッカー", "自転車", 
      "ひまわり", "ペンギン", "ラーメン", "新幹線", "メガネ",
      "東京タワー", "寿司", "クリスマスツリー", "ライオン", "宇宙船",
      "ピアノ", "カブトムシ", "ハンバーガー", "自由の女神", "オバケ"
    ];

    const PLAYER_COLORS = [
      { bg: "bg-red-600", border: "border-red-400" },
      { bg: "bg-blue-600", border: "border-blue-400" },
      { bg: "bg-emerald-600", border: "border-emerald-400" },
      { bg: "bg-amber-600", border: "border-amber-400" },
      { bg: "bg-purple-600", border: "border-purple-400" },
      { bg: "bg-pink-600", border: "border-pink-400" },
      { bg: "bg-teal-600", border: "border-teal-400" },
      { bg: "bg-indigo-600", border: "border-indigo-400" },
      { bg: "bg-orange-600", border: "border-orange-400" },
    ];

    let players = [
      { id: 0, name: "プレイヤー1", active: true, score: 0 },
      { id: 1, name: "プレイヤー2", active: true, score: 0 },
      { id: 2, name: "プレイヤー3", active: true, score: 0 },
      { id: 3, name: "プレイヤー4", active: false, score: 0 },
      { id: 4, name: "プレイヤー5", active: false, score: 0 },
      { id: 5, name: "プレイヤー6", active: false, score: 0 },
      { id: 6, name: "プレイヤー7", active: false, score: 0 },
      { id: 7, name: "プレイヤー8", active: false, score: 0 },
      { id: 8, name: "プレイヤー9", active: false, score: 0 },
    ];

    let currentArtistIndex = 0;
    let wordList = [...DEFAULT_WORDS];
    let usedWordIndices = new Set();
    let currentWord = "";
    
    let isGaming = false;
    let timerSeconds = 60;
    let timerInterval = null;

    let canvas, ctx;
    let isDrawing = false;
    let currentTool = 'pen';
    const PEN_LINE_WIDTH = 6;
    const ERASER_LINE_WIDTH = 32;

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'finish') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(392.00, audioCtx.currentTime);
          osc.frequency.setValueAtTime(261.63, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.6);
        }
      } catch (e) {
        console.error(e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      renderTvRankings();
      window.addEventListener('resize', resizeCanvas);
    });

    function initCanvas() {
      canvas = document.getElementById('paint-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      canvas.addEventListener('pointerdown', startDrawing);
      canvas.addEventListener('pointermove', draw);
      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
    }

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (canvas.width > 0) {
        tempCtx.drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (tempCanvas.width > 0) {
        ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
      }
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function startDrawing(e) {
      initAudio();
      isDrawing = true;
      const pos = getCanvasCoordinates(e);
      
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      if (currentTool === 'pen') {
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = PEN_LINE_WIDTH;
      } else {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = ERASER_LINE_WIDTH;
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasCoordinates(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
      }
    }

    function setTool(tool) {
      currentTool = tool;
      const penBtn = document.getElementById('tool-pen');
      const eraserBtn = document.getElementById('tool-eraser');

      if (tool === 'pen') {
        penBtn.className = "px-3 py-1.5 rounded font-bold text-xs bg-indigo-600 text-white border border-indigo-400 shadow";
        eraserBtn.className = "px-3 py-1.5 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700";
      } else {
        eraserBtn.className = "px-3 py-1.5 rounded font-bold text-xs bg-indigo-600 text-white border border-indigo-400 shadow";
        penBtn.className = "px-3 py-1.5 rounded font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700";
      }
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function toggleGame() {
      initAudio();
      if (isGaming) {
        stopGame();
      } else {
        startGame();
      }
    }

    function startGame() {
      if (wordList.length === 0) {
        alert("お題が登録されていません。設定からお題を追加してください。");
        return;
      }

      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length < 1) {
        alert("ゲームに参加するプレイヤーを最低1名以上設定してください。");
        return;
      }

      isGaming = true;
      timerSeconds = 60;
      usedWordIndices.clear();

      document.getElementById('btn-start').innerText = "中断";
      document.getElementById('btn-start').className = "bg-rose-600 hover:bg-rose-500 text-white font-bold py-1.5 px-4 rounded text-xs md:text-sm border border-rose-400 shadow";
      document.getElementById('btn-skip').disabled = false;

      clearCanvas();
      nextWord();

      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds <= 0) {
          finishRound();
        }
      }, 1000);
    }

    function stopGame() {
      isGaming = false;
      clearInterval(timerInterval);
      
      document.getElementById('btn-start').innerText = "スタート";
      document.getElementById('btn-start').className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-4 rounded text-xs md:text-sm border border-emerald-400 shadow";
      document.getElementById('btn-skip').disabled = true;
      document.getElementById('word-display').innerText = "「スタート」を押してね！";
      updateTimerDisplay(60);
    }

    function finishRound() {
      stopGame();
      playSound('finish');
      showResultModal();
    }

    function updateTimerDisplay(overrideSec) {
      const sec = overrideSec !== undefined ? overrideSec : timerSeconds;
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      
      document.getElementById('timer-text-overlay').innerText = `${mm}:${ss}`;

      const percentage = (sec / 60) * 100;
      document.getElementById('timer-progress-bar').style.width = `${percentage}%`;
    }

    function nextWord() {
      if (usedWordIndices.size >= wordList.length) {
        usedWordIndices.clear();
      }

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * wordList.length);
      } while (usedWordIndices.has(randomIndex) && usedWordIndices.size < wordList.length);

      usedWordIndices.add(randomIndex);
      currentWord = wordList[randomIndex];
      document.getElementById('word-display').innerText = currentWord;
      
      clearCanvas();
    }

    function skipWord() {
      if (!isGaming) return;
      nextWord();
    }

    function handleCorrectAnswer(winnerPlayerId) {
      if (!isGaming) return;

      playSound('correct');

      const activePlayers = players.filter(p => p.active);
      const artist = activePlayers[currentArtistIndex % activePlayers.length];
      if (artist) artist.score += 1;

      const winner = players.find(p => p.id === winnerPlayerId);
      if (winner && winner.id !== artist.id) {
        winner.score += 1;
      }

      renderTvRankings();
      nextWord();
    }

    function renderTvRankings() {
      const container = document.getElementById('tv-rankings-container');
      container.innerHTML = '';

      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length === 0) return;

      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];

      const sorted = activePlayers.map((p, originalIndex) => ({
        ...p,
        originalIndex
      })).sort((a, b) => b.score - a.score || a.id - b.id);

      sorted.forEach((player, rank) => {
        const colorStyle = PLAYER_COLORS[player.id % PLAYER_COLORS.length];
        const isArtist = currentArtist && currentArtist.id === player.id;

        const btn = document.createElement('button');
        btn.onclick = () => handleCorrectAnswer(player.id);
        
        btn.className = `player-card w-full flex-1 rounded-xl p-2 flex items-center justify-between border-2 transition active:scale-95 relative overflow-hidden shadow-md ${colorStyle.bg} ${colorStyle.border} ${isArtist ? 'ring-4 ring-amber-400 font-black' : 'opacity-90'}`;

        let rankBadge = `<span class="text-xs font-black w-5 text-center text-white/80">#${rank + 1}</span>`;
        if (rank === 0) rankBadge = `<span class="text-sm font-black w-5 text-center">🥇</span>`;
        if (rank === 1) rankBadge = `<span class="text-sm font-black w-5 text-center">🥈</span>`;
        if (rank === 2) rankBadge = `<span class="text-sm font-black w-5 text-center">🥉</span>`;

        btn.innerHTML = `
          ${isArtist ? '<span class="absolute top-0 right-0 bg-amber-400 text-black text-[8px] font-black px-1.5 py-0.2 rounded-bl-md shadow z-10">描き手</span>' : ''}
          <div class="flex items-center space-x-1 truncate flex-1 min-w-0 pr-1">
            ${rankBadge}
            <span class="text-xs md:text-sm font-extrabold text-white truncate">${player.name}</span>
          </div>
          <div class="text-right shrink-0">
            <span class="text-sm md:text-base font-black text-white font-mono bg-black/30 px-1.5 py-0.5 rounded border border-white/20">${player.score} <span class="text-[9px]">pt</span></span>
          </div>
        `;

        container.appendChild(btn);
      });
    }

    function openSettings() {
      if (isGaming) stopGame();

      renderPlayersSettingsList();
      document.getElementById('words-input').value = wordList.join('\n');
      updateWordsCountDisplay();

      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveAndCloseSettings() {
      const rawWords = document.getElementById('words-input').value;
      const parsedWords = rawWords.split('\n').map(w => w.trim()).filter(w => w.length > 0);
      
      if (parsedWords.length === 0) {
        alert("お題は最低1つ以上入力してください。");
        return;
      }

      wordList = parsedWords;

      const activePlayers = players.filter(p => p.active);
      if (currentArtistIndex >= activePlayers.length) {
        currentArtistIndex = 0;
      }

      renderTvRankings();
      closeSettings();
    }

    function switchTab(tabName) {
      const tabPlayers = document.getElementById('tab-content-players');
      const tabWords = document.getElementById('tab-content-words');
      const btnPlayers = document.getElementById('tab-btn-players');
      const btnWords = document.getElementById('tab-btn-words');

      if (tabName === 'players') {
        tabPlayers.classList.remove('hidden');
        tabWords.classList.add('hidden');
        btnPlayers.className = "px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white";
        btnWords.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400";
      } else {
        tabPlayers.classList.add('hidden');
        tabWords.classList.remove('hidden');
        btnWords.className = "px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white";
        btnPlayers.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400";
      }
    }

    function renderPlayersSettingsList() {
      const container = document.getElementById('players-list-container');
      container.innerHTML = '';

      const activePlayers = players.filter(p => p.active);

      players.forEach((player) => {
        const colorStyle = PLAYER_COLORS[player.id % PLAYER_COLORS.length];
        const activeIdx = activePlayers.findIndex(p => p.id === player.id);
        const isArtist = activeIdx === (currentArtistIndex % (activePlayers.length || 1));

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex flex-col justify-between space-y-2 bg-slate-950 ${player.active ? 'border-slate-700' : 'border-slate-800 opacity-50'}`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="w-3 h-3 rounded-full ${colorStyle.bg}"></span>
              <span class="font-bold text-slate-300 text-xs">P${player.id + 1}</span>
            </div>
            <label class="flex items-center cursor-pointer space-x-1">
              <span class="text-[10px] text-slate-400">${player.active ? '参加' : 'お休み'}</span>
              <input type="checkbox" ${player.active ? 'checked' : ''} onchange="togglePlayerActive(${player.id})" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
            </label>
          </div>

          <input type="text" value="${player.name}" onchange="updatePlayerName(${player.id}, this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white text-xs focus:outline-none focus:border-indigo-500" placeholder="名前">

          <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs">
            <span class="font-mono text-amber-400 font-bold">${player.score} pt</span>
            
            ${player.active ? `
              <button onclick="setArtistByPlayerId(${player.id})" class="px-2 py-0.5 rounded text-[10px] font-bold ${isArtist ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">
                ${isArtist ? '★ 現在の描き手' : '描き手に指定'}
              </button>
            ` : '<span></span>'}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function togglePlayerActive(playerId) {
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.active = !p.active;
        renderPlayersSettingsList();
      }
    }

    function updatePlayerName(playerId, newName) {
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.name = newName.trim() || `プレイヤー${playerId + 1}`;
      }
    }

    function setArtistByPlayerId(playerId) {
      const activePlayers = players.filter(p => p.active);
      const idx = activePlayers.findIndex(p => p.id === playerId);
      if (idx !== -1) {
        currentArtistIndex = idx;
        renderPlayersSettingsList();
      }
    }

    function resetScores() {
      if (confirm("全員のスコアを 0 pt にリセットしますか？")) {
        players.forEach(p => p.score = 0);
        renderPlayersSettingsList();
        renderTvRankings();
      }
    }

    function loadDefaultWords() {
      document.getElementById('words-input').value = DEFAULT_WORDS.join('\n');
      updateWordsCountDisplay();
    }

    function updateWordsCountDisplay() {
      const rawWords = document.getElementById('words-input').value;
      const parsedWords = rawWords.split('\n').map(w => w.trim()).filter(w => w.length > 0);
      document.getElementById('words-count-display').innerText = `現在のお題数: ${parsedWords.length}個`;
    }

    document.getElementById('words-input').addEventListener('input', updateWordsCountDisplay);

    function showResultModal() {
      const list = document.getElementById('result-ranking-list');
      list.innerHTML = '';

      const sorted = [...players.filter(p => p.active)].sort((a, b) => b.score - a.score);

      sorted.forEach((player, rank) => {
        const colorStyle = PLAYER_COLORS[player.id % PLAYER_COLORS.length];
        const item = document.createElement('div');
        item.className = "flex justify-between items-center bg-slate-900 px-3 py-2 rounded-lg border border-slate-800 text-sm";
        
        let medal = `#${rank + 1}`;
        if (rank === 0) medal = "🥇 1位";
        if (rank === 1) medal = "🥈 2位";
        if (rank === 2) medal = "🥉 3位";

        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="font-bold text-xs text-amber-400 w-12 text-left">${medal}</span>
            <span class="w-2.5 h-2.5 rounded-full ${colorStyle.bg}"></span>
            <span class="text-white font-bold">${player.name}</span>
          </div>
          <span class="font-mono font-black text-amber-300 text-base">${player.score} <span class="text-xs">pt</span></span>
        `;
        list.appendChild(item);
      });

      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length > 0) {
        currentArtistIndex = (currentArtistIndex + 1) % activePlayers.length;
        renderTvRankings();
      }

      document.getElementById('result-modal').classList.remove('hidden');
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
