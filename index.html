<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>テレビ映り込み位置測定ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: none;
      user-select: none;
      overflow: hidden;
      background-color: #000;
      color: #fff;
    }
  </style>
</head>
<body class="h-screen w-screen relative font-mono text-xs select-none">

  <!-- 目盛りグリッド背景 -->
  <div id="grid-container" class="absolute inset-0 w-full h-full"></div>

  <!-- 中央ラベル -->
  <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 pointer-events-none z-10 bg-black/60 backdrop-blur-xs">
    <h1 class="text-2xl font-bold text-amber-400 mb-2">テレビ画面 映り込み測定ツール</h1>
    <p class="text-sm text-gray-300 max-w-md">
      テレビ画面を見て、<br>
      <span class="text-emerald-400 font-bold">「テレビの端ギリギリに見えている一番外側の番号」</span><br>
      を【上・下・左・右】それぞれ教えてください！
    </p>
  </div>

  <script>
    const container = document.getElementById('grid-container');

    // 上の目盛り (Top 1% ~ 30%)
    for (let i = 1; i <= 30; i++) {
      const el = document.createElement('div');
      el.className = `absolute left-0 right-0 border-b ${i % 5 === 0 ? 'border-red-500 font-bold text-red-400' : 'border-gray-700 text-gray-400'}`;
      el.style.top = `${i}%`;
      el.style.height = '1%';
      el.innerHTML = `<span class="px-2 bg-black/70">TOP ${i}%</span>`;
      container.appendChild(el);
    }

    // 下の目盛り (Bottom 1% ~ 30%)
    for (let i = 1; i <= 30; i++) {
      const el = document.createElement('div');
      el.className = `absolute left-0 right-0 border-t ${i % 5 === 0 ? 'border-red-500 font-bold text-red-400' : 'border-gray-700 text-gray-400'}`;
      el.style.bottom = `${i}%`;
      el.style.height = '1%';
      el.innerHTML = `<span class="px-2 bg-black/70">BOTTOM ${i}%</span>`;
      container.appendChild(el);
    }

    // 左の目盛り (Left 1% ~ 25%)
    for (let i = 1; i <= 25; i++) {
      const el = document.createElement('div');
      el.className = `absolute top-0 bottom-0 border-r ${i % 5 === 0 ? 'border-cyan-500 font-bold text-cyan-400' : 'border-gray-700 text-gray-400'}`;
      el.style.left = `${i}%`;
      el.style.width = '1%';
      el.innerHTML = `<span class="py-1 px-0.5 bg-black/70 block [writing-mode:vertical-lr]">LEFT ${i}%</span>`;
      container.appendChild(el);
    }

    // 右の目盛り (Right 1% ~ 25%)
    for (let i = 1; i <= 25; i++) {
      const el = document.createElement('div');
      el.className = `absolute top-0 bottom-0 border-l ${i % 5 === 0 ? 'border-cyan-500 font-bold text-cyan-400' : 'border-gray-700 text-gray-400'}`;
      el.style.right = `${i}%`;
      el.style.width = '1%';
      el.innerHTML = `<span class="py-1 px-0.5 bg-black/70 block [writing-mode:vertical-lr]">RIGHT ${i}%</span>`;
      container.appendChild(el);
    }
  </script>
</body>
</html>
