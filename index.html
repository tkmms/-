<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>★お絵描き</title>

  <!-- PWA & iOS Safari フルスクリーン対応設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="★お絵描き">
  <meta name="theme-color" content="#020617">
  
  <!-- PWA Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"★お絵描き","short_name":"★お絵描き","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617"}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 全画面バウンス・スクロール・ズームの徹底防止 */
    html, body {
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
    }

    /* キャンバス領域のタッチ操作最適化 */
    canvas {
      touch-action: none;
      cursor: crosshair;
    }

    /* スクロール可能なエリア（モーダル用） */
    .scrollable-content {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    /* FLIP移動アニメーション用スタイル */
    .player-card-move {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ポイント獲得時の光るアニメーション */
    @keyframes scorePop {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.08); filter: brightness(1.6); ring-color: #f59e0b; }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .animate-score-pop {
      animation: scorePop 0.6s ease-out;
    }

    /* Floating Point (+1pt) アニメーション */
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.5); }
      30% { opacity: 1; transform: translateY(-12px) scale(1.3); }
      80% { opacity: 1; transform: translateY(-28px) scale(1); }
      100% { opacity: 0; transform: translateY(-38px) scale(0.8); }
    }

    .float-score-text {
      animation: floatUp 1.2s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body class="h-[100dvh] w-vw flex flex-col justify-between font-sans overflow-hidden">

  <!-- ========================================== -->
  <!-- 1. テレビに映るメイン領域 -->
  <!-- ========================================== -->
  <div class="flex-1 flex flex-col pt-[7dvh] px-[4vw] pb-[2.5dvh] min-h-0 relative">
    <div class="w-full h-full flex flex-row gap-3 min-h-0">
      
      <!-- テレビ左側：プレイヤーランキング縦並び（タップ無効表示専用） -->
      <aside id="tv-rankings-container" class="w-44 md:w-56 h-full flex flex-col gap-1.5 shrink-0 relative pointer-events-none select-none">
        <!-- JavaScriptで動的生成 -->
      </aside>

      <!-- テレビ中央〜右側：タイマーバー ＆ お絵描きキャンバス -->
      <main class="flex-1 h-full flex flex-col gap-2 min-h-0 min-w-0">
        
        <!-- YouTube風 タイマープログレスバー -->
        <div class="w-full bg-slate-800/90 rounded-full h-4 overflow-hidden border border-slate-700 relative shrink-0 shadow-inner">
          <div id="timer-progress-bar" class="h-full bg-gradient-to-r from-red-600 via-rose-500 to-amber-500 rounded-full transition-all duration-200 ease-linear w-full"></div>
          <span id="timer-text-overlay" class="absolute inset-0 flex items-center justify-center text-[11px] font-black text-white drop-shadow font-mono">
            01:00
          </span>
        </div>

        <!-- キャンバス容器 -->
        <div id="canvas-container" class="flex-1 w-full relative bg-white rounded-2xl overflow-hidden shadow-2xl border-2 border-slate-800 min-h-0">
          <canvas id="paint-canvas" class="w-full h-full"></canvas>
        </div>
      </main>

    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. テレビには絶対映らない秘密の領域（画面最下部：14dvh固定） -->
  <!-- ========================================== -->
  <footer class="h-[14dvh] w-full bg-slate-900 border-t-2 border-slate-800 px-3 py-1.5 flex items-center justify-between gap-2 shrink-0 z-20 shadow-2xl overflow-hidden relative">
    
    <!-- 正解者タップ用ヒントガイド（テレビ外の境界に配置） -->
    <div class="absolute -top-5 left-4 text-[10px] text-amber-300/80 font-bold tracking-wider pointer-events-none flex items-center space-x-1">
      <span>正解したら右下の「🎉 正解！」ボタンをタップ！</span>
    </div>

    <!-- お題 ＆ コントロールエリア -->
    <div class="flex-1 bg-amber-500/10 border-2 border-amber-500/50 rounded-xl px-3 py-1 flex items-center justify-between relative shadow-inner h-full overflow-hidden gap-2">
      
      <!-- お題表示（絵文字モードでも文字テキストのみ表示） -->
      <div class="flex-1 flex items-center justify-center h-full min-w-0">
        <div id="word-display" class="text-xl md:text-3xl font-black tracking-wider text-amber-300 truncate text-center">
          「スタート」を押してね！
        </div>
      </div>

      <!-- 右側ボタン群（タップしやすいサイズに最適化） -->
      <div class="flex items-center space-x-2 shrink-0">
        <button id="btn-correct-trigger" onclick="openAnswerModal()" disabled class="bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-black font-black py-2 px-4 rounded-xl text-xs md:text-sm border border-amber-300 shadow-lg active:scale-95 transition">
          🎉 正解！
        </button>
        <button id="btn-skip" onclick="skipWord()" disabled class="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-white font-bold py-2 px-3 rounded-xl text-xs border border-slate-600 active:scale-95 transition">
          パス
        </button>
        <button id="btn-start" onclick="toggleGame()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-xl text-xs md:text-sm border border-emerald-400 shadow active:scale-95 transition">
          スタート
        </button>
      </div>

    </div>

    <!-- 描画ツール（多色対応）＆設定ボタン -->
    <div class="h-full flex flex-col justify-between py-0.5 space-y-1 shrink-0">
      
      <!-- 描画ツール & 8色カラーパレット -->
      <div class="flex items-center space-x-1.5 bg-slate-950 border border-slate-700 p-1.5 rounded-xl">
        <div id="color-palette" class="flex items-center space-x-1.5 pr-1.5 border-r border-slate-800">
          <!-- JSで動的生成 -->
        </div>

        <button id="tool-eraser" onclick="setTool('eraser')" class="px-2.5 py-1.5 rounded-lg font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 active:scale-95 transition">
          🧹 消しゴム
        </button>
        <button onclick="clearCanvas()" class="px-2.5 py-1.5 rounded-lg font-bold text-xs bg-rose-900/80 hover:bg-rose-800 text-rose-200 border border-rose-700 active:scale-95 transition">
          🗑️ 全消し
        </button>
      </div>

      <!-- 設定ボタン -->
      <div class="flex items-center justify-end">
        <button onclick="openSettings()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center justify-center space-x-1 active:scale-95 transition font-bold">
          <span>⚙️ 設定・お題選択</span>
        </button>
      </div>
    </div>
  </footer>


  <!-- ========================================== -->
  <!-- 3. 🎉 正解選択モーダル（タイマー一時停止） -->
  <!-- ========================================== -->
  <div id="answer-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-500/80 rounded-2xl w-full max-w-2xl flex flex-col shadow-2xl overflow-hidden p-5 space-y-4 text-center">
      
      <!-- 正解表示エリア（絵文字モード時は巨大表示） -->
      <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 flex flex-col items-center justify-center min-h-[120px]">
        <span class="text-xs font-bold text-amber-400 mb-1">🎉 正解はこれだ！</span>
        <div id="modal-word-display" class="font-black text-amber-300 drop-shadow flex items-center justify-center space-x-3">
          <!-- 正解テキスト/絵文字表示 -->
        </div>
      </div>

      <p class="text-slate-300 text-xs md:text-sm font-bold">誰が回答しましたか？（正解者と描き手に +1 pt）</p>

      <!-- 3×3 のプレイヤー選択グリッド（登録順固定） -->
      <div id="answer-modal-grid" class="grid grid-cols-3 gap-3">
        <!-- JavaScriptで動的生成 -->
      </div>

      <div class="flex justify-center pt-2">
        <button onclick="closeAnswerModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-6 py-2 rounded-xl text-xs font-bold border border-slate-700">
          キャンセル（再開）
        </button>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 4. モーダル：設定＆プレイヤー・絵文字お題登録 -->
  <!-- ========================================== -->
  <div id="settings-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl">
      <!-- ヘッダー -->
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-xl font-bold text-white flex items-center space-x-2">
          <span>⚙️ ゲーム設定＆お題選択</span>
        </h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-2xl font-bold px-2">✕</button>
      </div>

      <!-- コンテンツ -->
      <div class="p-6 scrollable-content overflow-y-auto space-y-6 flex-1 text-sm">
        
        <!-- タブボタン & 読み上げON/OFF -->
        <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-3 gap-2">
          <div class="flex space-x-2">
            <button id="tab-btn-players" onclick="switchTab('players')" class="px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white">
              👥 プレイヤー編集
            </button>
            <button id="tab-btn-words" onclick="switchTab('words')" class="px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400">
              🎨 絵文字お題ON/OFF
            </button>
            <button id="tab-btn-custom" onclick="switchTab('custom')" class="px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400">
              📝 自由お題登録
            </button>
          </div>

          <!-- 音声読み上げ切り替え -->
          <label class="flex items-center space-x-2 cursor-pointer bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
            <span class="text-xs text-slate-300 font-bold">🔊 実況音声</span>
            <input type="checkbox" id="speech-toggle" onchange="toggleSpeech(this.checked)" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
          </label>
        </div>

        <!-- タブ1: プレイヤー管理 (直感的なカラーパレット選択) -->
        <div id="tab-content-players" class="space-y-4">
          <div class="flex justify-between items-center">
            <p class="text-slate-400 text-xs">
              プレイヤーの名前、アイコン絵文字、テーマカラーを選択できます（最大9名）。
            </p>
            <button onclick="resetScores()" class="text-xs bg-rose-900/50 hover:bg-rose-800 text-rose-300 border border-rose-700 px-3 py-1 rounded">
              スコアをリセット
            </button>
          </div>

          <div id="players-list-container" class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- 動的生成 -->
          </div>
        </div>

        <!-- タブ2: 絵文字お題ON/OFF選択 -->
        <div id="tab-content-words" class="space-y-4 hidden">
          <div class="bg-indigo-950/60 border border-indigo-500/40 p-3 rounded-xl flex items-center justify-between">
            <div>
              <span class="text-xs font-bold text-indigo-200">お題モード: 絵文字お題モード</span>
              <p class="text-[11px] text-slate-400">出題したい絵文字をタップしてON/OFFを切り替えられます。</p>
            </div>
            <button onclick="setAllEmojiWords(true)" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-lg border border-indigo-400">
              全選択
            </button>
          </div>

          <!-- 絵文字グリッドリスト -->
          <div id="emoji-words-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2.5 max-h-80 overflow-y-auto pr-1">
            <!-- 動的生成 -->
          </div>
        </div>

        <!-- タブ3: 自由お題登録 -->
        <div id="tab-content-custom" class="space-y-3 hidden">
          <p class="text-slate-400 text-xs">
            1行に1つの「お題」を入力・ペーストしてください。自由お題モードとして使用されます。
          </p>
          <textarea id="words-input" rows="8" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-mono text-sm focus:outline-none focus:border-indigo-500" placeholder="リンゴ&#10;ゴリラ&#10;ラッパ"></textarea>
          <div class="flex justify-between items-center text-xs text-slate-500">
            <span id="words-count-display">現在のお題数: 0個</span>
            <button onclick="loadDefaultWords()" class="text-indigo-400 hover:underline">デフォルトのお題を読み込む</button>
          </div>
        </div>

      </div>

      <!-- フッター -->
      <div class="p-4 border-t border-slate-800 flex justify-end">
        <button onclick="saveAndCloseSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2 rounded-xl shadow-lg">
          設定を保存して閉じる
        </button>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 5. モーダル：タイムアップ・その1分間の獲得ポイント発表 -->
  <!-- ========================================== -->
  <div id="result-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-500/50 rounded-2xl w-full max-w-md p-6 text-center shadow-2xl space-y-5">
      <div class="text-5xl">⏰</div>
      <h2 class="text-3xl font-black text-amber-400">タイムアップ！</h2>
      <p class="text-slate-300 text-xs">この1分間のゲーム結果です！</p>

      <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-amber-300 border-b border-slate-800 pb-1">🏆 1分間ラウンド獲得ポイント</h3>
        <div id="result-ranking-list" class="space-y-2 max-h-48 scrollable-content overflow-y-auto pr-1">
          <!-- 1分間の獲得ポイントランキング表示 -->
        </div>
      </div>

      <button onclick="closeResultModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg text-lg">
        次のラウンドへ！
      </button>
    </div>
  </div>

      { id: 4, name: "プレイヤー5", emoji: "🦁", colorIdx: 4, active: false, score: 0 },
      { id: 5, name: "プレイヤー6", emoji: "🐼", colorIdx: 5, active: false, score: 0 },
      { id: 6, name: "プレイヤー7", emoji: "🐻", colorIdx: 6, active: false, score: 0 },
      { id: 7, name: "プレイヤー8", emoji: "🐸", colorIdx: 7, active: false, score: 0 },
      { id: 8, name: "プレイヤー9", emoji: "🚀", colorIdx: 8, active: false, score: 0 },
    ];

    let players = [];
    let customWordList = [];
    let emojiWordList = [];
    let wordMode = 'emoji'; // 'emoji' or 'custom'
    let enableSpeech = true;
    let currentArtistIndex = 0;
    let usedWordIndices = new Set();
    let currentWordObj = null;
    
    let isGaming = false;
    let isPaused = false;
    let timerSeconds = 60;
    let timerInterval = null;

    // この1分間（1ラウンド）の獲得スコア記録
    let roundScores = {};

    let canvas, ctx;
    let isDrawing = false;
    let currentTool = 'pen';
    let currentPenColor = '#000000';
    const PEN_LINE_WIDTH = 6;
    const ERASER_LINE_WIDTH = 32;

    // Web Audio API ノード
    let audioCtx = null;
    let pencilNoiseNode = null;
    let pencilGainNode = null;
    let previousPositions = new Map();

    // iOSダブルタップ・ピンチズームの完全禁止
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // ----------------------------------------------------
    // 鉛筆書き擦れ効果音（Web Audio API ノイズ合成）
    // ----------------------------------------------------
    function initPencilSoundNode() {
      if (!audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1; // ホワイトノイズ
        }

        pencilNoiseNode = audioCtx.createBufferSource();
        pencilNoiseNode.buffer = noiseBuffer;
        pencilNoiseNode.loop = true;

        // 鉛筆の擦れ音に近づけるバンドパスフィルター
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800, audioCtx.currentTime);
        filter.Q.setValueAtTime(3.0, audioCtx.currentTime);

        pencilGainNode = audioCtx.createGain();
        pencilGainNode.gain.setValueAtTime(0, audioCtx.currentTime);

        pencilNoiseNode.connect(filter);
        filter.connect(pencilGainNode);
        pencilGainNode.connect(audioCtx.destination);
        pencilNoiseNode.start();
      } catch (e) {
        console.error("Pencil sound init error:", e);
      }
    }

    function startPencilSound() {
      if (!pencilGainNode || !audioCtx) return;
      pencilGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pencilGainNode.gain.setValueAtTime(currentTool === 'pen' ? 0.08 : 0.15, audioCtx.currentTime);
    }

    function stopPencilSound() {
      if (!pencilGainNode || !audioCtx) return;
      pencilGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pencilGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    }

    // ----------------------------------------------------
    // 音声実況ボイス
    // ----------------------------------------------------
    const VOICE_PHRASES = {
      start: [
        "よーい、スタート！キャンバスに描いてね！",
        "お絵描きタイム、スタート〜！",
        "画伯！描いて描いて〜！",
        "さあ何を描くのかな？スタート！"
      ],
      correctAnswerOpen: [
        "正解はこれでした！お見事！",
        "答えはこちら！分かったかな？",
        "正解発表！ナイス推理！",
        "見事に描けていましたね！正解はこれ！"
      ],
      correctWinner: [
        (name) => `${name}さん、大正解！ナイス推理！`,
        (name) => `すごーい！${name}さん正解！バッチリ！`,
        (name) => `天才！${name}さんに、1ポイント！`,
        (name) => `正解が出ました！${name}さんお見事！`
      ],
      pass: [
        "パス！次のお題へいくよ〜！",
        "うーん難しかった！次いってみよう！",
        "パス！どんどん描いて〜！"
      ],
      time30: [
        "残り、30秒だよ！",
        "折り返し！あと30秒！"
      ],
      time10: [
        "残り10秒！急いで急いで！",
        "ラスト10秒！ラストスパート！"
      ],
      finish: [
        "タイムアップ！1分間終了〜！",
        "終了〜！みんなお疲れ様でした〜！"
      ]
    };

    function getRandomPhrase(key, param) {
      const list = VOICE_PHRASES[key];
      if (!list || list.length === 0) return "";
      const item = list[Math.floor(Math.random() * list.length)];
      return typeof item === 'function' ? item(param) : item;
    }

    function unlockAudioAndSpeech() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        initPencilSoundNode();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if ('speechSynthesis' in window && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
    }

    function speakText(text) {
      if (!enableSpeech || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.15;
        uttr.pitch = 1.1;
        window.speechSynthesis.speak(uttr);
      } catch (e) {
        console.error("Speech error:", e);
      }
    }

    function toggleSpeech(checked) {
      enableSpeech = checked;
      saveStorageData();
    }

    // ----------------------------------------------------
    // ストレージ読み書き
    // ----------------------------------------------------
    function loadStorageData() {
      let loadedPlayers = localStorage.getItem(STORAGE_KEY_PLAYERS);
      if (!loadedPlayers) {
        for (const oldKey of OLD_PLAYER_KEYS) {
          const oldData = localStorage.getItem(oldKey);
          if (oldData) { loadedPlayers = oldData; break; }
        }
      }

      try {
        if (loadedPlayers) {
          const parsed = JSON.parse(loadedPlayers);
          players = parsed.map((p, idx) => ({
            ...DEFAULT_PLAYERS[idx],
            ...p,
            emoji: p.emoji || DEFAULT_PLAYERS[idx].emoji,
            colorIdx: p.colorIdx !== undefined ? p.colorIdx : (idx % COLOR_OPTIONS.length)
          }));
        } else {
          players = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
        }
      } catch (e) {
        players = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
      }

      let loadedWords = localStorage.getItem(STORAGE_KEY_WORDS);
      if (!loadedWords) {
        for (const oldKey of OLD_WORD_KEYS) {
          const oldData = localStorage.getItem(oldKey);
          if (oldData) { loadedWords = oldData; break; }
        }
      }

      try {
        customWordList = loadedWords ? JSON.parse(loadedWords) : [...DEFAULT_WORDS];
      } catch (e) {
        customWordList = [...DEFAULT_WORDS];
      }

      try {
        const savedEmoji = localStorage.getItem(STORAGE_KEY_EMOJI);
        emojiWordList = savedEmoji ? JSON.parse(savedEmoji) : JSON.parse(JSON.stringify(DEFAULT_EMOJI_WORDS));
      } catch (e) {
        emojiWordList = JSON.parse(JSON.stringify(DEFAULT_EMOJI_WORDS));
      }

      try {
        const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
        if (savedSettings) {
          const settings = JSON.parse(savedSettings);
          enableSpeech = settings.enableSpeech !== undefined ? settings.enableSpeech : true;
          wordMode = settings.wordMode || 'emoji';
        }
      } catch (e) {}

      document.getElementById('speech-toggle').checked = enableSpeech;
      saveStorageData();
    }

    function saveStorageData() {
      try {
        localStorage.setItem(STORAGE_KEY_PLAYERS, JSON.stringify(players));
        localStorage.setItem(STORAGE_KEY_WORDS, JSON.stringify(customWordList));
        localStorage.setItem(STORAGE_KEY_EMOJI, JSON.stringify(emojiWordList));
        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify({ enableSpeech, wordMode }));
      } catch (e) {
        console.error("Storage save failed:", e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStorageData();
      initCanvas();
      renderColorPalette();
      renderTvRankings();
      window.addEventListener('resize', resizeCanvas);
    });

    function renderColorPalette() {
      const container = document.getElementById('color-palette');
      container.innerHTML = '';

      PEN_COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.onclick = () => selectPenColor(c.id);
        const isSelected = currentTool === 'pen' && currentPenColor === c.id;

        btn.className = `w-5 h-5 rounded-full ${c.bg} border-2 transition ${isSelected ? 'scale-125 border-white ring-2 ring-indigo-400 z-10' : 'border-transparent hover:scale-110 opacity-80'}`;
        container.appendChild(btn);
      });
    }

    function selectPenColor(hexColor) {
      currentTool = 'pen';
      currentPenColor = hexColor;
      renderColorPalette();
      setToolUI();
    }

    function initCanvas() {
      canvas = document.getElementById('paint-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      canvas.addEventListener('pointerdown', startDrawing);
      canvas.addEventListener('pointermove', draw);
      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
    }

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (canvas.width > 0) {
        tempCtx.drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (tempCanvas.width > 0) {
        ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
      }
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function startDrawing(e) {
      unlockAudioAndSpeech();
      isDrawing = true;
      startPencilSound(); // 擦れ音開始

      const pos = getCanvasCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      if (currentTool === 'pen') {
        ctx.strokeStyle = currentPenColor;
        ctx.lineWidth = PEN_LINE_WIDTH;
      } else {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = ERASER_LINE_WIDTH;
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasCoordinates(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
        stopPencilSound(); // 擦れ音停止
      }
    }

    function setTool(tool) {
      currentTool = tool;
      renderColorPalette();
      setToolUI();
    }

    function setToolUI() {
      const eraserBtn = document.getElementById('tool-eraser');
      if (currentTool === 'eraser') {
        eraserBtn.className = "px-2.5 py-1.5 rounded-lg font-bold text-xs bg-indigo-600 text-white border border-indigo-400 shadow";
      } else {
        eraserBtn.className = "px-2.5 py-1.5 rounded-lg font-bold text-xs bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700";
      }
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function toggleGame() {
      unlockAudioAndSpeech();
      if (isGaming) {
        stopGame();
      } else {
        startGame();
      }
    }

    function getActiveWordList() {
      if (wordMode === 'emoji') {
        return emojiWordList.filter(item => item.active);
      } else {
        return customWordList.map((w, idx) => ({ id: idx, name: w, emoji: null }));
      }
    }

    function startGame() {
      const activeList = getActiveWordList();
      if (activeList.length === 0) {
        alert("お題が登録されていないか、絵文字がすべてOFFになっています。設定からお題を有効にしてください。");
        return;
      }

      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length < 1) {
        alert("ゲームに参加するプレイヤーを最低1名以上設定してください。");
        return;
      }

      isGaming = true;
      isPaused = false;
      timerSeconds = 60;
      usedWordIndices.clear();

      // ラウンド獲得ポイントを初期化
      roundScores = {};
      players.forEach(p => { roundScores[p.id] = 0; });

      document.getElementById('btn-start').innerText = "中断";
      document.getElementById('btn-start').className = "bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 px-4 rounded-xl text-xs md:text-sm border border-rose-400 shadow active:scale-95 transition";
      document.getElementById('btn-skip').disabled = false;
      document.getElementById('btn-correct-trigger').disabled = false;

      clearCanvas();
      nextWord();

      speakText(getRandomPhrase('start'));

      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (isPaused) return; // 正解モーダル表示中はタイマー一時停止

        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds === 30) {
          speakText(getRandomPhrase('time30'));
        } else if (timerSeconds === 10) {
          speakText(getRandomPhrase('time10'));
        }

        if (timerSeconds <= 0) {
          finishRound();
        }
      }, 1000);
    }

    function stopGame() {
      isGaming = false;
      isPaused = false;
      clearInterval(timerInterval);
      
      document.getElementById('btn-start').innerText = "スタート";
      document.getElementById('btn-start').className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-xl text-xs md:text-sm border border-emerald-400 shadow active:scale-95 transition";
      document.getElementById('btn-skip').disabled = true;
      document.getElementById('btn-correct-trigger').disabled = true;
      document.getElementById('word-display').innerText = "「スタート」を押してね！";
      updateTimerDisplay(60);
    }

    function finishRound() {
      stopGame();
      playSound('finish');
      speakText(getRandomPhrase('finish'));
      showResultModal();
    }

    function updateTimerDisplay(overrideSec) {
      const sec = overrideSec !== undefined ? overrideSec : timerSeconds;
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      
      document.getElementById('timer-text-overlay').innerText = `${mm}:${ss}`;

      const percentage = (sec / 60) * 100;
      document.getElementById('timer-progress-bar').style.width = `${percentage}%`;
    }

    function nextWord() {
      const activeList = getActiveWordList();
      if (usedWordIndices.size >= activeList.length) {
        usedWordIndices.clear();
      }

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * activeList.length);
      } while (usedWordIndices.has(randomIndex) && usedWordIndices.size < activeList.length);

      usedWordIndices.add(randomIndex);
      currentWordObj = activeList[randomIndex];
      
      // 描き手画面（フッター）のお題表示：テキストのみ表示
      document.getElementById('word-display').innerText = currentWordObj.name;
      clearCanvas();
    }

    function skipWord() {
      if (!isGaming) return;
      speakText(getRandomPhrase('pass'));
      nextWord();
    }

    // ----------------------------------------------------
    // 🎉 正解モーダル制御（タイマー一時停止）
    // ----------------------------------------------------
    function openAnswerModal() {
      if (!isGaming) return;
      unlockAudioAndSpeech();
      isPaused = true; // タイマー一時停止

      const displayContainer = document.getElementById('modal-word-display');
      
      // 正解モーダルでの表示：絵文字モード時は巨大絵文字＋テキスト名称を表示
      if (wordMode === 'emoji' && currentWordObj.emoji) {
        displayContainer.innerHTML = `
          <span class="text-7xl md:text-9xl leading-none block my-1 drop-shadow-md">${currentWordObj.emoji}</span>
          <span class="text-2xl md:text-4xl font-black text-amber-200 block">${currentWordObj.name}</span>
        `;
      } else {
        displayContainer.innerHTML = `<span class="text-3xl md:text-5xl font-black">${currentWordObj.name}</span>`;
      }

      // 開いたときのランダム実況ボイス
      speakText(getRandomPhrase('correctAnswerOpen'));

      renderAnswerModalGrid();
      document.getElementById('answer-modal').classList.remove('hidden');
    }

    function closeAnswerModal() {
      document.getElementById('answer-modal').classList.add('hidden');
      isPaused = false; // タイマー再開
    }

    function renderAnswerModalGrid() {
      const grid = document.getElementById('answer-modal-grid');
      grid.innerHTML = '';

      const activePlayers = players.filter(p => p.active);
      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];

      players.forEach((player) => {
        if (!player.active) return;

        const colorStyle = COLOR_OPTIONS[player.colorIdx % COLOR_OPTIONS.length] || COLOR_OPTIONS[0];
        const isArtist = currentArtist && currentArtist.id === player.id;

        const btn = document.createElement('button');
        btn.onclick = () => submitCorrectWinner(player.id);
        
        btn.className = `p-3.5 rounded-xl border-2 flex items-center justify-between transition active:scale-95 shadow-lg relative ${colorStyle.bg} ${colorStyle.border} ${isArtist ? 'ring-4 ring-amber-400 font-black' : ''}`;

        btn.innerHTML = `
          ${isArtist ? '<span class="absolute -top-2 -right-1 bg-amber-400 text-black text-[9px] font-black px-1.5 py-0.2 rounded-full shadow">描き手</span>' : ''}
          <div class="flex items-center space-x-2 truncate min-w-0">
            <span class="text-2xl md:text-3xl shrink-0">${player.emoji}</span>
            <span class="text-xs md:text-sm font-extrabold text-white truncate">${player.name}</span>
          </div>
          <span class="text-xs font-mono font-bold text-white/80 bg-black/30 px-1.5 py-0.5 rounded">${player.score}pt</span>
        `;

        grid.appendChild(btn);
      });
    }

    function submitCorrectWinner(winnerPlayerId) {
      if (!isGaming) return;
      playSound('correct');

      const activePlayers = players.filter(p => p.active);
      const artist = activePlayers[currentArtistIndex % activePlayers.length];
      if (artist) {
        artist.score += 1;
        roundScores[artist.id] = (roundScores[artist.id] || 0) + 1; // ラウンド獲得スコア加算
      }

      const winner = players.find(p => p.id === winnerPlayerId);
      if (winner && winner.id !== artist.id) {
        winner.score += 1;
        roundScores[winner.id] = (roundScores[winner.id] || 0) + 1; // ラウンド獲得スコア加算
      }

      if (winner) {
        speakText(getRandomPhrase('correctWinner', winner.name));
      }

      saveStorageData();
      closeAnswerModal(); // モーダル閉じる & タイマー再開
      
      renderTvRankingsWithAnimation();
      triggerScoreAnimation(winnerPlayerId, artist ? artist.id : null);
      nextWord();
    }

    function triggerScoreAnimation(winnerId, artistId) {
      const idsToAnimate = new Set([winnerId, artistId].filter(id => id !== null));
      
      idsToAnimate.forEach(id => {
        const card = document.getElementById(`player-card-${id}`);
        if (card) {
          card.classList.add('animate-score-pop');
          
          const floatEl = document.createElement('div');
          floatEl.className = 'absolute inset-0 flex items-center justify-center font-black text-amber-300 text-xl md:text-2xl drop-shadow-lg float-score-text z-30';
          floatEl.innerText = '+1 pt!';
          card.appendChild(floatEl);

          setTimeout(() => {
            card.classList.remove('animate-score-pop');
            if (floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
          }, 1200);
        }
      });
    }

    function renderTvRankingsWithAnimation() {
      const container = document.getElementById('tv-rankings-container');
      
      const children = Array.from(container.children);
      children.forEach(child => {
        const id = child.id;
        if (id) { previousPositions.set(id, child.getBoundingClientRect()); }
      });

      renderTvRankings();

      const newChildren = Array.from(container.children);
      newChildren.forEach(child => {
        const id = child.id;
        const first = previousPositions.get(id);
        if (first) {
          const last = child.getBoundingClientRect();
          const deltaY = first.top - last.top;

          if (deltaY !== 0) {
            child.style.transform = `translateY(${deltaY}px)`;
            child.style.transition = 'none';

            requestAnimationFrame(() => {
              child.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
              child.style.transform = '';
            });
          }
        }
      });
    }

    // 左側テレビ用ランキング表示（メダル＆順位表記：4位以降は 4位、5位）
    function renderTvRankings() {
      const container = document.getElementById('tv-rankings-container');
      container.innerHTML = '';

      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length === 0) return;

      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];

      const sorted = activePlayers.map((p, originalIndex) => ({
        ...p,
        originalIndex
      })).sort((a, b) => b.score - a.score || a.id - b.id);

      sorted.forEach((player, rank) => {
        const colorStyle = COLOR_OPTIONS[player.colorIdx % COLOR_OPTIONS.length] || COLOR_OPTIONS[0];
        const isArtist = currentArtist && currentArtist.id === player.id;

        const card = document.createElement('div');
        card.id = `player-card-${player.id}`;
        
        card.className = `player-card-move w-full flex-1 rounded-xl p-2 flex items-center justify-between border-2 transition relative overflow-hidden shadow-md ${colorStyle.bg} ${colorStyle.border} ${isArtist ? 'ring-4 ring-amber-400 font-black' : 'opacity-90'}`;

        let rankBadge = `<span class="text-xs font-bold w-6 text-center text-white/90">${rank + 1}位</span>`;
        if (rank === 0) rankBadge = `<span class="text-sm font-black w-6 text-center">🥇</span>`;
        if (rank === 1) rankBadge = `<span class="text-sm font-black w-6 text-center">🥈</span>`;
        if (rank === 2) rankBadge = `<span class="text-sm font-black w-6 text-center">🥉</span>`;

        card.innerHTML = `
          ${isArtist ? '<span class="absolute top-0 right-0 bg-amber-400 text-black text-[8px] font-black px-1.5 py-0.2 rounded-bl-md shadow z-10">描き手</span>' : ''}
          <div class="flex items-center space-x-1.5 truncate flex-1 min-w-0 pr-1">
            ${rankBadge}
            <span class="text-xl md:text-2xl leading-none shrink-0 drop-shadow-sm">${player.emoji}</span>
            <span class="text-xs md:text-sm font-extrabold text-white truncate">${player.name}</span>
          </div>
          <div class="text-right shrink-0">
            <span class="text-sm md:text-base font-black text-white font-mono bg-black/30 px-1.5 py-0.5 rounded border border-white/20">${player.score} <span class="text-[9px]">pt</span></span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function openSettings() {
      if (isGaming) stopGame();

      renderPlayersSettingsList();
      renderEmojiWordsSettingsGrid();
      document.getElementById('words-input').value = customWordList.join('\n');
      
      updateWordsCountDisplay();
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveAndCloseSettings() {
      const rawWords = document.getElementById('words-input').value;
      const parsedWords = rawWords.split('\n').map(w => w.trim()).filter(w => w.length > 0);
      
      customWordList = parsedWords;

      const activePlayers = players.filter(p => p.active);
      if (currentArtistIndex >= activePlayers.length) {
        currentArtistIndex = 0;
      }

      saveStorageData();
      renderTvRankings();
      closeSettings();
    }

    function switchTab(tabName) {
      const tabPlayers = document.getElementById('tab-content-players');
      const tabWords = document.getElementById('tab-content-words');
      const tabCustom = document.getElementById('tab-content-custom');
      
      const btnPlayers = document.getElementById('tab-btn-players');
      const btnWords = document.getElementById('tab-btn-words');
      const btnCustom = document.getElementById('tab-btn-custom');

      tabPlayers.classList.add('hidden');
      tabWords.classList.add('hidden');
      tabCustom.classList.add('hidden');

      btnPlayers.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400";
      btnWords.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400";
      btnCustom.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400";

      if (tabName === 'players') {
        tabPlayers.classList.remove('hidden');
        btnPlayers.className = "px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white";
      } else if (tabName === 'words') {
        wordMode = 'emoji';
        tabWords.classList.remove('hidden');
        btnWords.className = "px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white";
      } else if (tabName === 'custom') {
        wordMode = 'custom';
        tabCustom.classList.remove('hidden');
        btnCustom.className = "px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white";
      }
      saveStorageData();
    }

    // プレイヤー編集設定画面（直感的カラーピッカー）
    function renderPlayersSettingsList() {
      const container = document.getElementById('players-list-container');
      container.innerHTML = '';

      const activePlayers = players.filter(p => p.active);

      players.forEach((player) => {
        const activeIdx = activePlayers.findIndex(p => p.id === player.id);
        const isArtist = activeIdx === (currentArtistIndex % (activePlayers.length || 1));

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex flex-col justify-between space-y-2 bg-slate-950 ${player.active ? 'border-slate-700' : 'border-slate-800 opacity-50'}`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-slate-300 text-xs">P${player.id + 1}</span>
            <label class="flex items-center cursor-pointer space-x-1">
              <span class="text-[10px] text-slate-400">${player.active ? '参加' : 'お休み'}</span>
              <input type="checkbox" ${player.active ? 'checked' : ''} onchange="togglePlayerActive(${player.id})" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
            </label>
          </div>

          <div class="flex space-x-2">
            <select onchange="updatePlayerEmoji(${player.id}, this.value)" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-lg text-white focus:outline-none">
              ${EMOJI_OPTIONS.map(e => `<option value="${e}" ${e === player.emoji ? 'selected' : ''}>${e}</option>`).join('')}
            </select>
            <input type="text" value="${player.name}" onchange="updatePlayerName(${player.id}, this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white text-xs focus:outline-none focus:border-indigo-500" placeholder="名前">
          </div>

          <!-- 直感的な丸型カラーピッカー選択UI -->
          <div class="space-y-1">
            <span class="text-[10px] text-slate-400 block">テーマカラー:</span>
            <div class="flex flex-wrap gap-1">
              ${COLOR_OPTIONS.map((c, i) => `
                <button onclick="updatePlayerColor(${player.id}, ${i})" class="w-4 h-4 rounded-full ${c.bg} border ${i === player.colorIdx ? 'border-white ring-2 ring-indigo-400 scale-110 z-10' : 'border-transparent opacity-70 hover:opacity-100'}"></button>
              `).join('')}
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs">
            <span class="font-mono text-amber-400 font-bold">${player.score} pt</span>
            ${player.active ? `
              <button onclick="setArtistByPlayerId(${player.id})" class="px-2 py-0.5 rounded text-[10px] font-bold ${isArtist ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">
                ${isArtist ? '★ 描き手' : '描き手に指定'}
              </button>
            ` : '<span></span>'}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // 絵文字お題個別ON/OFFグリッドの描画
    function renderEmojiWordsSettingsGrid() {
      const container = document.getElementById('emoji-words-grid');
      container.innerHTML = '';

      emojiWordList.forEach((item) => {
        const btn = document.createElement('button');
        btn.onclick = () => toggleEmojiWordItem(item.id);
        
        btn.className = `p-2 rounded-xl border flex items-center justify-between transition ${item.active ? 'bg-slate-800 border-indigo-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-500 opacity-60'}`;

        btn.innerHTML = `
          <div class="flex items-center space-x-2 truncate">
            <span class="text-xl">${item.emoji}</span>
            <span class="text-xs font-bold truncate">${item.name}</span>
          </div>
          <span class="text-xs font-bold ${item.active ? 'text-emerald-400' : 'text-slate-600'}">${item.active ? 'ON' : 'OFF'}</span>
        `;

        container.appendChild(btn);
      });
    }

    function toggleEmojiWordItem(id) {
      const item = emojiWordList.find(x => x.id === id);
      if (item) {
        item.active = !item.active;
        saveStorageData();
        renderEmojiWordsSettingsGrid();
      }
    }

    function setAllEmojiWords(activeState) {
      emojiWordList.forEach(x => x.active = activeState);
      saveStorageData();
      renderEmojiWordsSettingsGrid();
    }

    function togglePlayerActive(playerId) {
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.active = !p.active;
        saveStorageData();
        renderPlayersSettingsList();
      }
    }

    function updatePlayerName(playerId, newName) {
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.name = newName.trim() || `プレイヤー${playerId + 1}`;
        saveStorageData();
      }
    }

    function updatePlayerEmoji(playerId, emoji) {
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.emoji = emoji;
        saveStorageData();
      }
    }

    function updatePlayerColor(playerId, colorIdx) {
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.colorIdx = colorIdx;
        saveStorageData();
        renderPlayersSettingsList();
      }
    }

    function setArtistByPlayerId(playerId) {
      const activePlayers = players.filter(p => p.active);
      const idx = activePlayers.findIndex(p => p.id === playerId);
      if (idx !== -1) {
        currentArtistIndex = idx;
        renderPlayersSettingsList();
      }
    }

    function resetScores() {
      if (confirm("全員のスコアを 0 pt にリセットしますか？")) {
        players.forEach(p => p.score = 0);
        roundScores = {};
        saveStorageData();
        renderPlayersSettingsList();
        renderTvRankings();
      }
    }

    function loadDefaultWords() {
      document.getElementById('words-input').value = DEFAULT_WORDS.join('\n');
      updateWordsCountDisplay();
    }

    function updateWordsCountDisplay() {
      const rawWords = document.getElementById('words-input').value;
      const parsedWords = rawWords.split('\n').map(w => w.trim()).filter(w => w.length > 0);
      document.getElementById('words-count-display').innerText = `現在のお題数: ${parsedWords.length}個`;
    }

    document.getElementById('words-input').addEventListener('input', updateWordsCountDisplay);

    // 1分間（1ラウンド）獲得ポイントのランキング発表モーダル
    function showResultModal() {
      const list = document.getElementById('result-ranking-list');
      list.innerHTML = '';

      const activePlayers = players.filter(p => p.active);

      // この1分間（1ラウンド）で獲得したポイントでランキングソート
      const roundRanked = activePlayers.map(p => ({
        ...p,
        roundScore: roundScores[p.id] || 0
      })).sort((a, b) => b.roundScore - a.roundScore || b.score - a.score);

      roundRanked.forEach((player, rank) => {
        const colorStyle = COLOR_OPTIONS[player.colorIdx % COLOR_OPTIONS.length] || COLOR_OPTIONS[0];
        const item = document.createElement('div');
        item.className = "flex justify-between items-center bg-slate-900 px-3 py-2 rounded-lg border border-slate-800 text-sm";
        
        let rankBadge = `<span class="font-bold text-xs text-amber-400 w-12 text-left">${rank + 1}位</span>`;
        if (rank === 0) rankBadge = `<span class="font-bold text-xs text-amber-400 w-12 text-left">🥇 1位</span>`;
        if (rank === 1) rankBadge = `<span class="font-bold text-xs text-amber-400 w-12 text-left">🥈 2位</span>`;
        if (rank === 2) rankBadge = `<span class="font-bold text-xs text-amber-400 w-12 text-left">🥉 3位</span>`;

        item.innerHTML = `
          <div class="flex items-center space-x-2">
            ${rankBadge}
            <span class="text-xl">${player.emoji}</span>
            <span class="text-white font-bold">${player.name}</span>
          </div>
          <div class="text-right font-mono font-black text-amber-300 text-base">
            +${player.roundScore} <span class="text-xs text-slate-400">pt (累計 ${player.score}pt)</span>
          </div>
        `;
        list.appendChild(item);
      });

      // 次の描き手へ交代
      if (activePlayers.length > 0) {
        currentArtistIndex = (currentArtistIndex + 1) % activePlayers.length;
        renderTvRankings();
      }

      document.getElementById('result-modal').classList.remove('hidden');
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
