<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>アテテ！</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="アテテ！">
  <meta name="theme-color" content="#020617">
  <link rel="manifest" href='data:application/manifest+json,{"name":"アテテ！","short_name":"アテテ！","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617"}'>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      touch-action: none;
      cursor: crosshair;
    }
    .scrollable-content {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    .player-card-move {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes scorePop {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.08); filter: brightness(1.6); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .animate-score-pop { animation: scorePop 0.6s ease-out; }
    @keyframes periodicJump {
      0%, 80%, 100% { transform: translateY(0); }
      85% { transform: translateY(-15px) scale(1.05); }
      90% { transform: translateY(0); }
      95% { transform: translateY(-8px) scale(1.02); }
    }
    .animate-periodic-jump { animation: periodicJump 3s infinite ease-in-out; }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.5); }
      30% { opacity: 1; transform: translateY(-12px) scale(1.3); }
      80% { opacity: 1; transform: translateY(-28px) scale(1); }
      100% { opacity: 0; transform: translateY(-38px) scale(0.8); }
    }
    .float-score-text { animation: floatUp 1.2s ease-out forwards; pointer-events: none; }
    .modal-hidden { display: none !important; }
  </style>
</head>
<body class="h-[100dvh] w-vw flex flex-col justify-between font-sans overflow-hidden relative">

  <!-- ヘッダー -->
  <header class="absolute top-0.5 left-0 right-0 z-30 px-[5vw] flex items-center justify-between pointer-events-auto">
    <div class="flex items-center space-x-3">
      <button id="header-main-btn" onclick="headerMainBtnWithSE()" class="bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3 py-1 rounded-xl text-xs font-bold shadow-lg flex items-center space-x-1 active:scale-95 transition touch-action-none">
        <span>⚙️ 設定</span>
      </button>
      <span class="text-base md:text-lg font-black text-amber-300 tracking-wider drop-shadow">アテテ！</span>
    </div>
    <div class="flex items-center space-x-2">
      <div id="color-palette" class="flex items-center space-x-1.5"></div>
      <button id="palette-toggle-btn" onclick="togglePaletteWithSE()" class="ml-1 px-2 py-1 rounded-lg font-bold text-[10px] bg-pink-200 text-pink-900 border border-pink-300 active:scale-95 transition touch-action-none">🌸 パステル</button>
      <button onclick="clearCanvasWithSE()" class="ml-4 px-2.5 py-1 rounded-lg font-bold text-xs bg-rose-900/80 hover:bg-rose-800 text-rose-200 border border-rose-700 active:scale-95 transition shadow touch-action-none">🗑️ 全消し</button>
    </div>
  </header>

  <!-- メイン -->
  <div class="flex-1 flex flex-col pt-[8.5dvh] px-[5vw] pb-[2.5dvh] min-h-0 relative">
    <div class="w-full h-full flex flex-row gap-3 min-h-0">
      <aside id="tv-rankings-container" class="w-44 md:w-56 h-full flex flex-col gap-1.5 shrink-0 relative select-none"></aside>
      <main class="flex-1 h-full flex flex-col gap-2 min-h-0 min-w-0 relative">
        <div class="w-full bg-slate-800/90 rounded-full h-4 overflow-hidden border border-slate-700 relative shrink-0 shadow-inner">
          <div id="timer-progress-bar" class="h-full bg-gradient-to-r from-red-600 via-rose-500 to-amber-500 rounded-full transition-all duration-200 ease-linear w-full"></div>
          <span id="timer-text-overlay" class="absolute inset-0 flex items-center justify-center text-[11px] font-black text-white drop-shadow font-mono">01:00</span>
        </div>
        <div id="canvas-container" class="flex-1 w-full relative bg-white rounded-2xl overflow-hidden shadow-2xl border-2 border-slate-800 min-h-0">
          <canvas id="color-canvas" class="absolute inset-0 w-full h-full"></canvas>
          <canvas id="black-canvas" class="absolute inset-0 w-full h-full"></canvas>
          <button onclick="undoCanvasWithSE()" class="absolute top-2 left-2 z-30 bg-slate-800/80 hover:bg-slate-700 text-white px-2 py-1 rounded-lg text-xs font-bold border border-slate-600 shadow active:scale-95 transition touch-action-none">↩️ 戻る</button>
          <div id="center-start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-20 transition-opacity duration-300">
            <div class="text-center space-y-6">
              <span class="text-xs font-bold tracking-widest text-amber-400 block uppercase">次のアーティスト</span>
              <div id="center-artist-display" class="flex items-center justify-center space-x-3 bg-slate-900 border-2 border-amber-500/60 px-6 py-4 rounded-3xl shadow-2xl"></div>
              <div class="bg-slate-900/80 border border-slate-700 px-4 py-2 rounded-full flex items-center justify-center space-x-3 w-fit mx-auto">
                <button onclick="switchGroupPrevWithSE()" class="text-slate-300 hover:text-white text-lg font-black touch-action-none">◀</button>
                <span id="start-group-title" class="text-lg md:text-xl font-bold text-white whitespace-nowrap">デフォルト</span>
                <button onclick="switchGroupNextWithSE()" class="text-slate-300 hover:text-white text-lg font-black touch-action-none">▶</button>
              </div>
              <button onclick="toggleGameWithSE()" class="mt-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-4 px-12 rounded-3xl text-2xl md:text-3xl border-4 border-emerald-300 shadow-2xl active:scale-95 transition animate-bounce touch-action-none">▶️ スタート！</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- フッター -->
  <footer class="h-[14dvh] w-full bg-slate-900 border-t-2 border-slate-800 px-4 py-1.5 flex items-center justify-between gap-2 shrink-0 z-20 shadow-2xl overflow-hidden relative">
    <div class="absolute -top-5 left-6 text-[10px] text-amber-300/80 font-bold tracking-wider pointer-events-none">正解したら右側の「🎉 正解！」ボタンをタップ！</div>
    <div class="w-full bg-amber-500/10 border-2 border-amber-500/50 rounded-2xl px-4 py-1.5 flex items-center justify-between relative shadow-inner h-full overflow-hidden gap-3">
      <div id="footer-active-controls-left" class="flex items-center space-x-2 shrink-0 opacity-0 pointer-events-none transition-opacity duration-300">
        <button id="btn-skip" onclick="skipWordWithSE()" disabled class="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-white font-black py-4 px-8 rounded-2xl text-base md:text-lg border border-slate-600 shadow-lg active:scale-95 transition touch-action-none">パス</button>
      </div>
      <div class="flex-1 flex items-center justify-center h-full min-w-0 px-3">
        <div id="word-display" class="font-black tracking-wider text-amber-300 text-center truncate w-full" style="font-size: clamp(1.2rem, 3vw, 2.4rem);">「スタート」を押してね！</div>
      </div>
      <div id="footer-active-controls-right" class="flex items-center shrink-0 opacity-0 pointer-events-none transition-opacity duration-300">
        <button id="btn-correct-trigger" onclick="openAnswerModalWithSE()" disabled class="bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-black font-black py-4 px-8 rounded-2xl text-base md:text-lg border border-amber-300 shadow-lg active:scale-95 transition touch-action-none">🎉 正解！</button>
      </div>
    </div>
  </footer>

  <!-- 正解モーダル -->
  <div id="answer-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 modal-hidden flex items-center justify-center p-3">
    <div class="bg-slate-900 border-2 border-amber-500/80 rounded-2xl w-full max-w-5xl h-[68vh] flex flex-col shadow-2xl overflow-hidden p-5 space-y-2 relative -top-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2 shrink-0">
        <span class="text-xs md:text-sm font-bold text-amber-400">🎉 正解発表！正解したプレイヤーをタップ</span>

      </div>
      <div class="flex-1 flex flex-col md:flex-row gap-4 min-h-0 overflow-hidden items-stretch">

        </div>
        <div id="answer-modal-grid" class="w-full md:w-1/2 grid grid-cols-3 gap-3 h-full overflow-y-auto p-2"></div>
      </div>
      <div class="flex justify-between pt-1 border-t border-slate-800 shrink-0 gap-2">
        <button onclick="imageSearchWithSE()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-1.5 rounded-xl text-xs font-bold border border-indigo-400 active:scale-95 transition touch-action-none">🔍 画像検索</button>

      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 modal-hidden flex items-center justify-center p-4">

        <h2 class="text-xl font-bold text-white">⚙️ ゲーム設定＆お題編集</h2>
        <button onclick="closeSettingsWithSE()" class="text-slate-400 hover:text-white text-2xl font-bold px-2 touch-action-none">✕</button>
      </div>
      <div class="p-6 scrollable-content overflow-y-auto space-y-6 flex-1 text-sm">
        <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-3 gap-2">
          <div class="flex space-x-2">
            <button id="tab-btn-players" onclick="switchTabWithSE('players')" class="px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white touch-action-none">👥 プレイヤー編集</button>
            <button id="tab-btn-words" onclick="switchTabWithSE('words')" class="px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400 touch-action-none">📝 お題グループ編集</button>

          <div class="flex items-center gap-3">
            <label class="flex items-center space-x-2 cursor-pointer bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">

              <input type="checkbox" id="speech-toggle" onchange="toggleSpeech(this.checked)" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
            </label>
            <label class="flex items-center space-x-2 cursor-pointer bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
              <span class="text-xs text-slate-300 font-bold">🎨 アーティストpt</span>
              <input type="checkbox" id="artist-point-toggle" onchange="toggleArtistPoint(this.checked)" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
            </label>
          </div>
        </div>
        <div id="tab-content-players" class="space-y-4">
          <div class="flex justify-between items-center">
            <p class="text-slate-400 text-xs">プレイヤーの名前、アイコン絵文字、テーマカラーを選択できます（最大9名）。</p>
            <button onclick="resetScoresWithSE()" class="text-xs bg-rose-900/50 hover:bg-rose-800 text-rose-300 border border-rose-700 px-3 py-1 rounded touch-action-none">スコアをリセット</button>
          </div>
          <div id="players-list-container" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>
        <div id="tab-content-words" class="space-y-3 modal-hidden">
          <div class="bg-indigo-950/60 border border-indigo-500/40 p-3 rounded-xl">
            <span class="text-xs font-bold text-indigo-200 block mb-1">お題の入力形式について</span>
            <p class="text-[11px] text-slate-300">「<span class="text-amber-300 font-bold">🎺 トランペット</span>」のように、絵文字と名前をスペース区切りで1行ずつ入力してください。<br>グループごとにお題を保存でき、スタート画面で切り替えられます。</p>
          </div>
          <div id="word-groups-container" class="space-y-4"></div>
          <button onclick="addWordGroupWithSE()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl shadow-lg border border-slate-600 active:scale-95 transition touch-action-none">＋ グループを追加</button>
        </div>
      </div>
      <div class="p-4 border-t border-slate-800 flex justify-end">
        <button onclick="saveAndCloseSettingsWithSE()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2 rounded-xl shadow-lg touch-action-none">設定を保存して閉じる</button>
      </div>
    </div>
  </div>

  <!-- 結果モーダル -->
  <div id="result-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 modal-hidden flex flex-col justify-between p-4 pt-10">
    <div class="bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-amber-500/60 rounded-3xl w-full max-w-5xl h-[68vh] mx-auto flex flex-col p-5 shadow-2xl space-y-3 relative overflow-hidden mt-8">
      <div class="flex items-center justify-between border-b border-amber-500/30 pb-3 shrink-0">
        <div class="flex items-center space-x-3">
          <span class="text-3xl">🎨</span>
          <h2 id="result-gallery-title" class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-100 tracking-wider">〇〇さんのアート作品</h2>
        </div>
        <span class="text-xs font-bold text-amber-400/80 bg-amber-950/80 border border-amber-500/40 px-3 py-1 rounded-full">✨ ラウンド終了</span>
      </div>
      <div class="flex-1 flex flex-col md:flex-row gap-4 min-h-0 overflow-hidden">
        <div class="w-full md:w-8/12 bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col min-h-0 shadow-inner">
          <h3 class="text-xs font-bold text-amber-300 border-b border-slate-800 pb-1.5 shrink-0 mb-2">🖼️ 展示ギャラリー</h3>
          <div id="result-drawings-gallery" class="flex-1 grid grid-cols-2 md:grid-cols-3 gap-3 scrollable-content overflow-y-auto pr-1"></div>
        </div>
        <div class="w-full md:w-4/12 bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col min-h-0 shadow-inner">
          <h3 class="text-xs font-bold text-amber-300 border-b border-slate-800 pb-1.5 shrink-0 mb-2">🏆 ランキング</h3>
          <div id="result-ranking-list" class="flex-1 space-y-2 scrollable-content overflow-y-auto pr-1"></div>
        </div>
      </div>
    </div>
    <div class="w-full max-w-xl mx-auto py-2 shrink-0">
      <button onclick="closeResultModalWithSE()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-2xl shadow-2xl text-base md:text-lg border-2 border-emerald-400 active:scale-95 transition touch-action-none">次のラウンドへ進む ➔</button>
    </div>
  </div>

    function startAudioKeepAlive() {
      if (keepAliveInterval) return;
      keepAliveInterval = setInterval(() => {
        if (!audioCtx || audioCtx.state !== 'running') return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
      }, 4000);
    }
    function initPencilSoundNode() {
      if (!audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        pencilNoiseNode = audioCtx.createBufferSource();
        pencilNoiseNode.buffer = noiseBuffer;
        pencilNoiseNode.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800, audioCtx.currentTime);
        filter.Q.setValueAtTime(3.0, audioCtx.currentTime);
        pencilGainNode = audioCtx.createGain();
        pencilGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        pencilNoiseNode.connect(filter); filter.connect(pencilGainNode); pencilGainNode.connect(audioCtx.destination);
        pencilNoiseNode.start();
      } catch(e) { console.error("Pencil sound error:", e); }
    }
    function startPencilSound() {
      if (!pencilGainNode || !audioCtx) return;
      pencilGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pencilGainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
    }
    function stopPencilSound() {
      if (!pencilGainNode || !audioCtx) return;
      pencilGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pencilGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    }

        initPencilSoundNode();

    function initCanvas() {
      colorCanvas = document.getElementById('color-canvas');
      blackCanvas = document.getElementById('black-canvas');
      colorCtx = colorCanvas.getContext('2d');
      blackCtx = blackCanvas.getContext('2d');
      resizeCanvas();
      blackCanvas.addEventListener('pointerdown', startDrawing);
      blackCanvas.addEventListener('pointermove', draw);
      blackCanvas.addEventListener('pointerup', stopDrawing);
      blackCanvas.addEventListener('pointercancel', stopDrawing);
    }
    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      resizeLayer(colorCanvas, colorCtx, rect);
      resizeLayer(blackCanvas, blackCtx, rect);
    }
    function resizeLayer(cv, c, rect) {
      const temp = document.createElement('canvas');
      temp.width = cv.width; temp.height = cv.height;
      const tctx = temp.getContext('2d');
      if (cv.width > 0) tctx.drawImage(cv, 0, 0);
      cv.width = rect.width; cv.height = rect.height;
      c.clearRect(0, 0, cv.width, cv.height);
      if (temp.width > 0) c.drawImage(temp, 0, 0, cv.width, cv.height);
    }
    function getCanvasCoordinates(e) {
      const rect = blackCanvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    // 描画開始（長押し判定・Undo保存）
    function startDrawing(e) {
      unlockAudioAndSpeech();
      isPointerDown = true;
      longPressTriggered = false;
      startPos = getCanvasCoordinates(e);
      isDrawing = false;
      drawCtxs = [];
      saveStateForUndo(); // 現在の状態を保存
      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        performFill(startPos.x, startPos.y);
        stopPencilSound();
        longPressTimer = null;
      }, 500);
    }
    function draw(e) {
      if (!isPointerDown || longPressTriggered) return;
      const pos = getCanvasCoordinates(e);
      const dx = pos.x - startPos.x, dy = pos.y - startPos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (longPressTimer && dist > 3) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        beginDrawing(startPos);
      }
      if (isDrawing) {
        drawCtxs.forEach(c => {
          c.lineTo(pos.x, pos.y);
          c.stroke();
        });
      }
    }
    function stopDrawing() {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      if (!longPressTriggered && !isDrawing) {
        beginDrawing(startPos);
        drawCtxs.forEach(c => {
          c.lineTo(startPos.x, startPos.y);
          c.stroke();
        });
      }
      if (isDrawing) {
        drawCtxs.forEach(c => {
          c.closePath();
          c.globalCompositeOperation = 'source-over';
        });
        isDrawing = false;
        stopPencilSound();
      }
      isPointerDown = false;
    }

    function beginDrawing(pos) {
      isDrawing = true;
      startPencilSound();
      const colorObj = (usePastelColors ? PASTEL_COLORS : PEN_COLORS).find(c => c.id === currentPenColor);
      drawCtxs = [];
      if (currentPenColor === '#ffffff') {
        drawCtxs = [colorCtx, blackCtx];
        drawCtxs.forEach(c => {
          c.globalCompositeOperation = 'destination-out';
          c.lineWidth = ERASER_LINE_WIDTH;
          c.strokeStyle = 'rgba(0,0,0,1)';
          c.beginPath();
          c.moveTo(pos.x, pos.y);
          c.lineCap = 'round'; c.lineJoin = 'round';
        });
      } else if (colorObj && colorObj.isOverlayColor) {
        drawCtxs = [colorCtx];
        colorCtx.globalCompositeOperation = 'source-over';
        colorCtx.lineWidth = COLOR_LINE_WIDTH;
        colorCtx.strokeStyle = currentPenColor;
        colorCtx.beginPath();
        colorCtx.moveTo(pos.x, pos.y);
        colorCtx.lineCap = 'round'; colorCtx.lineJoin = 'round';
      } else {
        drawCtxs = [blackCtx];
        blackCtx.globalCompositeOperation = 'source-over';
        blackCtx.lineWidth = BLACK_LINE_WIDTH;
        blackCtx.strokeStyle = currentPenColor;
        blackCtx.beginPath();
        blackCtx.moveTo(pos.x, pos.y);
        blackCtx.lineCap = 'round'; blackCtx.lineJoin = 'round';
      }
    }

    // フラッドフィル（黒線を境界として扱う）
    function performFill(x, y) {
      if (currentPenColor === '#ffffff') return;
      if (currentPenColor === '#000000') {
        floodFill(blackCtx, x, y, currentPenColor, null);
      } else {
        floodFill(colorCtx, x, y, currentPenColor, blackCtx);
      }
      playButtonSE();
    }

    function floodFill(ctx, x, y, hexColor, boundaryCtx) {
      const w = ctx.canvas.width, h = ctx.canvas.height;
      if (w === 0 || h === 0) return;
      const ix = Math.floor(x), iy = Math.floor(y);
      if (ix < 0 || ix >= w || iy < 0 || iy >= h) return;
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;
      const startIdx = (iy * w + ix) * 4;
      const sr = data[startIdx], sg = data[startIdx+1], sb = data[startIdx+2], sa = data[startIdx+3];
      const rgb = hexToRgb(hexColor);
      const tolerance = 30;
      const visited = new Uint8Array(w * h);
      const queue = [iy * w + ix];
      visited[iy * w + ix] = 1;

      let boundaryData = null;
      if (boundaryCtx) boundaryData = boundaryCtx.getImageData(0, 0, w, h).data;

      const match = (idx) => Math.abs(data[idx] - sr) <= tolerance && Math.abs(data[idx+1] - sg) <= tolerance && Math.abs(data[idx+2] - sb) <= tolerance && Math.abs(data[idx+3] - sa) <= tolerance;
      const isBoundary = (idx) => {
        if (!boundaryData) return false;
        return boundaryData[idx+3] > 0 && boundaryData[idx] < 50 && boundaryData[idx+1] < 50 && boundaryData[idx+2] < 50;
      };

      while (queue.length) {
        const p = queue.shift();
        const idx = p * 4;
        if (isBoundary(idx)) continue;
        if (match(idx)) {
          data[idx] = rgb.r; data[idx+1] = rgb.g; data[idx+2] = rgb.b; data[idx+3] = 255;
          const xp = p % w, yp = Math.floor(p / w);
          if (xp > 0 && !visited[p-1]) { visited[p-1]=1; queue.push(p-1); }
          if (xp < w-1 && !visited[p+1]) { visited[p+1]=1; queue.push(p+1); }
          if (yp > 0 && !visited[p-w]) { visited[p-w]=1; queue.push(p-w); }
          if (yp < h-1 && !visited[p+w]) { visited[p+w]=1; queue.push(p+w); }
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1],16), g: parseInt(result[2],16), b: parseInt(result[3],16) } : { r:0, g:0, b:0 };
    }

    // Undo機能
    function saveStateForUndo() {
      if (!colorCanvas || !blackCanvas) return;
      if (undoStack.length >= 20) undoStack.shift();
      undoStack.push({
        color: colorCanvas.toDataURL(),
        black: blackCanvas.toDataURL()
      });
    }
    function undoCanvasWithSE() {
      playButtonSE();
      undoCanvas();
    }
    function undoCanvas() {
      if (undoStack.length === 0) {
        speakText("戻れる操作がありません");
        return;
      }
      const state = undoStack.pop();
      restoreState(state);
    }
    function restoreState(state) {
      const imgC = new Image();
      const imgB = new Image();
      let loaded = 0;
      const tryDraw = () => {
        loaded++;
        if (loaded === 2) {
          colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
          colorCtx.drawImage(imgC, 0, 0);
          blackCtx.clearRect(0, 0, blackCanvas.width, blackCanvas.height);
          blackCtx.drawImage(imgB, 0, 0);
        }
      };
      imgC.onload = tryDraw;
      imgB.onload = tryDraw;
      imgC.src = state.color;
      imgB.src = state.black;
    }

    function clearCanvas() {
      colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
      blackCtx.clearRect(0, 0, blackCanvas.width, blackCanvas.height);
    }
    function getCombinedCanvasDataURL() {
      const temp = document.createElement('canvas');
      temp.width = colorCanvas.width; temp.height = colorCanvas.height;
      const tctx = temp.getContext('2d');
      tctx.fillStyle = '#ffffff';
      tctx.fillRect(0, 0, temp.width, temp.height);
      tctx.drawImage(colorCanvas, 0, 0);
      tctx.drawImage(blackCanvas, 0, 0);
      return temp.toDataURL('image/png');
    }
    function clearCanvasWithSE() {
      playButtonSE();
      saveStateForUndo();
      clearCanvas();
    }

    function startGame() {
      if (parsedWordList.length === 0) { alert("お題が登録されていません。設定からお題を追加してください。"); return; }
      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length < 1) { alert("ゲームに参加するプレイヤーを最低1名以上設定してください。"); return; }
      isGaming = true; isPaused = false; timerSeconds = 60; usedWordIndices.clear();
      roundScores = {}; roundDrawingsHistory = [];
      players.forEach(p => { roundScores[p.id] = 0; });
      document.getElementById('center-start-overlay').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('footer-active-controls-left').classList.remove('opacity-0', 'pointer-events-none');

      speakText(getRandomPhrase('start', currentArtist ? currentArtist.name : "アーティスト"));
      updateTimerDisplay();

        if (isPaused) return;
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds === 3) speakText("3");
        else if (timerSeconds === 2) speakText("2");
        else if (timerSeconds === 1) speakText("1");
        else if (timerSeconds === 30) {
          const act = players.filter(p => p.active);
          const art = act[currentArtistIndex % act.length];
          speakText(getRandomPhrase('time30', art ? art.name : "アーティスト"));
        }
        if (timerSeconds <= 0) finishRound();
      }, 1000);
    }
    function stopGame() {
      isGaming = false; isPaused = false; clearInterval(timerInterval);
      document.getElementById('center-start-overlay').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('footer-active-controls-left').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('footer-active-controls-right').classList.add('opacity-0', 'pointer-events-none');

      document.getElementById('btn-correct-trigger').disabled = true;

    function finishRound() {
      saveCurrentCanvasToHistory(null, true);

    function updateTimerDisplay(overrideSec) {
      const sec = overrideSec !== undefined ? overrideSec : timerSeconds;
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      document.getElementById('timer-text-overlay').innerText = `${mm}:${ss}`;
      document.getElementById('timer-progress-bar').style.width = `${(sec / 60) * 100}%`;
    }
    function saveCurrentCanvasToHistory(winnerPlayer, isUnfinished = false) {
      if (!colorCanvas || !currentWordObj) return;
      try {
        const timeTaken = Math.max(1, currentWordStartTime - timerSeconds);
        const dataUrl = getCombinedCanvasDataURL();
        roundDrawingsHistory.push({
          dataUrl,
          wordName: currentWordObj.name,
          wordEmoji: currentWordObj.emoji,
          timeTaken,
          isUnfinished,
          winnerName: winnerPlayer ? winnerPlayer.name : null,
          winnerEmoji: winnerPlayer ? winnerPlayer.emoji : null
        });
      } catch(e) { console.error("Canvas save error:", e); }
    }
    function nextWord() {
      if (usedWordIndices.size >= parsedWordList.length) usedWordIndices.clear();
      let randomIndex;
      do { randomIndex = Math.floor(Math.random() * parsedWordList.length); } while (usedWordIndices.has(randomIndex) && usedWordIndices.size < parsedWordList.length);
      usedWordIndices.add(randomIndex);
      currentWordObj = parsedWordList[randomIndex];
      currentWordStartTime = timerSeconds;
      document.getElementById('word-display').innerText = currentWordObj.name;
      clearCanvas();
      currentPenColor = '#000000';
      renderColorPalette();
    }

      if (!isGaming) return;

      const activePlayers = players.filter(p => p.active);

    function renderAnswerModalGrid() {
      const grid = document.getElementById('answer-modal-grid');
      grid.innerHTML = '';
      const activePlayers = players.filter(p => p.active);
      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];
      players.forEach((player) => {

        const isArtist = currentArtist && currentArtist.id === player.id;

        const btn = document.createElement('button');
        btn.onclick = () => submitCorrectWinner(player.id);
        btn.className = `p-2 rounded-2xl border-2 flex flex-col items-center justify-between transition active:scale-95 shadow-lg relative ${colorStyle.bg} ${colorStyle.border} ${isArtist ? 'ring-4 ring-amber-400 font-black' : ''} touch-action-none`;
        btn.innerHTML = `

    function submitCorrectWinner(winnerPlayerId) {
      if (!isGaming) return;
      const activePlayers = players.filter(p => p.active);
      const artist = activePlayers[currentArtistIndex % activePlayers.length];
      if (artist && artistPointEnabled) {
        artist.score += 1;
        roundScores[artist.id] = (roundScores[artist.id] || 0) + 1;
      }
      const winner = players.find(p => p.id === winnerPlayerId);
      if (winner && winner.id !== artist.id) {
        winner.score += 1;
        roundScores[winner.id] = (roundScores[winner.id] || 0) + 1;
      }
      saveCurrentCanvasToHistory(winner, false);
      if (winner) speakText(getRandomPhrase('afterCorrectWinner', winner.name));
      saveStorageData();
      closeAnswerModal();
      renderTvRankingsWithAnimation();
      triggerScoreAnimation(winnerPlayerId, artist ? artist.id : null);
      nextWord();

    function triggerScoreAnimation(winnerId, artistId) {
      const idsToAnimate = new Set([winnerId, artistId].filter(id => id !== null));
      idsToAnimate.forEach(id => {
        const card = document.getElementById(`player-card-${id}`);
        if (card) {
          card.classList.add('animate-score-pop');
          const floatEl = document.createElement('div');
          floatEl.className = 'absolute inset-0 flex items-center justify-center font-black text-amber-300 text-xl md:text-2xl drop-shadow-lg float-score-text z-30';
          floatEl.innerText = '+1 pt!';
          card.appendChild(floatEl);
          setTimeout(() => {
            card.classList.remove('animate-score-pop');
            if (floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
          }, 1200);
        }
      });
    }
    function renderTvRankingsWithAnimation() {
      const container = document.getElementById('tv-rankings-container');
      const children = Array.from(container.children);
      children.forEach(child => { const id = child.id; if (id) previousPositions.set(id, child.getBoundingClientRect()); });
      renderTvRankings();
      const newChildren = Array.from(container.children);
      newChildren.forEach(child => {
        const id = child.id;
        const first = previousPositions.get(id);
        if (first) {
          const last = child.getBoundingClientRect();
          const deltaY = first.top - last.top;
          if (deltaY !== 0) {
            child.style.transform = `translateY(${deltaY}px)`;
            child.style.transition = 'none';
            requestAnimationFrame(() => {
              child.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
              child.style.transform = '';
            });
          }
        }
      });
    }
    function renderTvRankings() {
      const container = document.getElementById('tv-rankings-container');
      container.innerHTML = '';
      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length === 0) return;
      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];
      const sorted = activePlayers.map((p, originalIndex) => ({...p, originalIndex})).sort((a,b) => b.score - a.score || a.id - b.id);
      let currentRank = 1;
      const rankedPlayers = sorted.map((player, idx, arr) => {
        if (idx > 0 && player.score < arr[idx-1].score) currentRank = idx + 1;
        return { ...player, displayRank: currentRank };
      });
      rankedPlayers.forEach((player) => {
        const colorStyle = COLOR_OPTIONS[player.colorIdx % COLOR_OPTIONS.length] || COLOR_OPTIONS[0];
        const isArtist = currentArtist && currentArtist.id === player.id;
        const rank = player.displayRank;

        card.id = `player-card-${player.id}`;
        if (!isGaming) { card.onclick = () => selectArtistByCardTap(player.id); card.style.cursor = 'pointer'; }

        let rankBadge = `<span class="text-xs font-bold w-6 text-center text-white/90">${rank}位</span>`;

        if (rank === 3) rankBadge = `<span class="text-sm font-black w-6 text-center">🥉</span>`;
        card.innerHTML = `
          ${isArtist ? '<span class="absolute top-0 right-0 bg-amber-400 text-black text-[8px] font-black px-1.5 py-0.2 rounded-bl-md shadow z-30">アーティスト</span>' : ''}

          </div>`;
        container.appendChild(card);

          </div>
          <div class="flex space-x-2">
            <select onchange="updatePlayerEmoji(${player.id}, this.value)" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-lg text-white focus:outline-none">
              ${EMOJI_OPTIONS.map(e => `<option value="${e}" ${e === player.emoji ? 'selected' : ''}>${e}</option>`).join('')}
            </select>
            <input type="text" value="${player.name}" onchange="updatePlayerName(${player.id}, this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white text-xs focus:outline-none focus:border-indigo-500" placeholder="名前">
          </div>
          <div class="space-y-1">
            <span class="text-[10px] text-slate-400 block">テーマカラー:</span>
            <div class="flex flex-wrap gap-1">
              ${COLOR_OPTIONS.map((c, i) => `<button onclick="updatePlayerColor(${player.id}, ${i})" class="w-4 h-4 rounded-full ${c.bg} border ${i === player.colorIdx ? 'border-white ring-2 ring-indigo-400 scale-110 z-10' : 'border-transparent opacity-70 hover:opacity-100'} touch-action-none"></button>`).join('')}
            </div>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs">
            <span class="font-mono text-amber-400 font-bold">${player.score} pt</span>
            ${player.active ? `<button onclick="setArtistByPlayerId(${player.id})" class="px-2 py-0.5 rounded text-[10px] font-bold ${isArtist ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'} touch-action-none">${isArtist ? '★ アーティスト' : 'アーティストに指定'}</button>` : '<span></span>'}
          </div>`;
        container.appendChild(card);
      });
    }
    function togglePlayerActive(playerId) { playButtonSE(); const p = players.find(x => x.id === playerId); if (p) { p.active = !p.active; saveStorageData(); renderPlayersSettingsList(); } }
    function updatePlayerName(playerId, newName) { const p = players.find(x => x.id === playerId); if (p) { p.name = newName.trim() || `プレイヤー${playerId + 1}`; saveStorageData(); } }
    function updatePlayerEmoji(playerId, emoji) { playButtonSE(); const p = players.find(x => x.id === playerId); if (p) { p.emoji = emoji; saveStorageData(); } }
    function updatePlayerColor(playerId, colorIdx) { playButtonSE(); const p = players.find(x => x.id === playerId); if (p) { p.colorIdx = colorIdx; saveStorageData(); renderPlayersSettingsList(); } }
    function setArtistByPlayerId(playerId) { playButtonSE(); const activePlayers = players.filter(p => p.active); const idx = activePlayers.findIndex(p => p.id === playerId); if (idx !== -1) { currentArtistIndex = idx; renderPlayersSettingsList(); } }
    function resetScores() { if (confirm("全員のスコアを 0 pt にリセットしますか？")) { players.forEach(p => p.score = 0); roundScores = {}; saveStorageData(); renderPlayersSettingsList(); renderTvRankings(); } }

    // 結果モーダル
    function saveDrawingAsImage(dataUrl, wordName, artistName, timeTaken) {
      playButtonSE();
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 1080; c.height = 1080;
        const cx = c.getContext('2d');
        const grad = cx.createLinearGradient(0,0,0,1080);
        grad.addColorStop(0,'#0f172a'); grad.addColorStop(1,'#1e1b4b');
        cx.fillStyle = grad; cx.fillRect(0,0,1080,1080);
        cx.fillStyle = '#fef3c7'; cx.font = 'bold 48px sans-serif'; cx.textAlign = 'center'; cx.fillText(`${wordName}`, 540, 85);
        cx.fillStyle = '#ffffff'; cx.roundRect(90,110,900,780,24); cx.fill();
        cx.drawImage(img, 110,130,860,740);
        cx.fillStyle = '#fbbf24'; cx.font = 'bold 44px sans-serif'; cx.textAlign = 'center'; cx.fillText(`${artistName}`, 540, 955);
        const now = new Date(); const days = ['日','月','火','水','木','金','土'];
        const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日(${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}  所要時間 ${timeTaken}秒`;
        cx.fillStyle = '#94a3b8'; cx.font = '22px sans-serif'; cx.fillText(dateStr, 540, 1015);
        const link = document.createElement('a');
        link.download = `${wordName}_${artistName}.png`;
        link.href = c.toDataURL('image/png');
        link.click();
      };
      img.src = dataUrl;
    }
    function showResultModal() {
      const list = document.getElementById('result-ranking-list');
      const gallery = document.getElementById('result-drawings-gallery');
      const galleryTitle = document.getElementById('result-gallery-title');
      list.innerHTML = ''; gallery.innerHTML = '';
      const activePlayers = players.filter(p => p.active);
      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];
      const artistName = currentArtist ? currentArtist.name : "アーティスト";
      galleryTitle.innerText = `${artistName}さんのアート作品`;

      const detectives = activePlayers.filter(p => !currentArtist || p.id !== currentArtist.id);
      const roundRanked = detectives.map(p => ({...p, roundScore: roundScores[p.id] || 0})).sort((a,b) => b.roundScore - a.roundScore || b.id - a.id);
      let currentRank = 1;
      const rankedRoundDetectives = roundRanked.map((player, idx, arr) => {
        if (idx > 0 && player.roundScore < arr[idx-1].roundScore) currentRank = idx + 1;
        return { ...player, displayRank: currentRank };
      });
      rankedRoundDetectives.forEach((player) => {
        const item = document.createElement('div');
        const isZero = player.roundScore === 0;
        item.className = `flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-sm transition ${isZero ? 'opacity-40' : 'opacity-100'}`;
        let rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">${player.displayRank}位</span>`;
        if (player.displayRank === 1) rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">🥇 1位</span>`;
        if (player.displayRank === 2) rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">🥈 2位</span>`;
        if (player.displayRank === 3) rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">🥉 3位</span>`;
        item.innerHTML = `
          <div class="flex items-center space-x-1.5 truncate">
            ${rankBadge}
            <span class="text-lg">${player.emoji}</span>
            <span class="text-white font-bold text-xs truncate max-w-[80px]">${player.name}</span>
          </div>
          <div class="text-right font-mono font-black ${isZero ? 'text-slate-500' : 'text-amber-300'} text-xs shrink-0">+${player.roundScore} <span class="text-[9px] text-slate-400">(累計${player.score}pt)</span></div>`;
        list.appendChild(item);
      });
      if (roundDrawingsHistory.length === 0) {
        gallery.innerHTML = `<div class="col-span-3 text-slate-500 text-xs py-12 text-center w-full">このラウンドで描かれた作品はありません</div>`;
      } else {
        roundDrawingsHistory.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = "bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-amber-500/30 rounded-xl p-2 flex flex-col items-center space-y-1.5 text-center shadow-lg relative";
          const safeWordName = item.wordName.replace(/'/g, "\\'");
          card.innerHTML = `
            <div class="w-full h-24 md:h-28 bg-white rounded-lg overflow-hidden border-2 border-slate-800 shadow-inner flex items-center justify-center p-1 relative">
              <img src="${item.dataUrl}" class="max-w-full max-h-full object-contain">
            </div>
            <div class="w-full flex items-center justify-between px-1">
              <div class="text-xs font-black text-amber-300 truncate flex items-center space-x-1">
                ${item.wordEmoji ? `<span class="text-sm">${item.wordEmoji}</span>` : ''}
                <span>${item.wordName}</span>
              </div>
              <div class="flex items-center space-x-1 shrink-0">
                <span class="text-[10px] font-mono bg-amber-500/20 text-amber-300 px-1 py-0.2 rounded border border-amber-500/30">${item.timeTaken}秒</span>
                <button onclick="saveDrawingAsImage('${item.dataUrl}', '${safeWordName}', '${artistName}', ${item.timeTaken})" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow border border-indigo-400 active:scale-95 transition touch-action-none">📥</button>
                <button onclick="imageSearchByWordWithSE('${safeWordName}')" class="bg-slate-600 hover:bg-slate-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow border border-slate-400 active:scale-95 transition touch-action-none">🔍</button>
              </div>
            </div>
            <div class="text-[10px] text-slate-400 truncate w-full text-center border-t border-slate-800/80 pt-1">
              ${item.winnerName ? `<span class="text-emerald-400 font-bold">🎉 正解: ${item.winnerEmoji || ''}${item.winnerName}</span>` : '<span class="text-slate-500">（途中作品 / 未完成）</span>'}
            </div>`;
          gallery.appendChild(card);
          if (index === roundDrawingsHistory.length - 1 && item.isUnfinished) speakText(getRandomPhrase('unfinishedComment', artistName));
          else speakText(getRandomPhrase('drawingTimeComment', artistName, item.timeTaken));
        });
      }
      if (activePlayers.length > 0) {
        currentArtistIndex = (currentArtistIndex + 1) % activePlayers.length;
        renderTvRankings();
      }
      document.getElementById('result-modal').classList.remove('modal-hidden');
    }
    function closeResultModalWithSE() { playButtonSE(); closeResultModal(); }
    function closeResultModal() {
      document.getElementById('result-modal').classList.add('modal-hidden');
      const activePlayers = players.filter(p => p.active);
      const nextArtist = activePlayers[currentArtistIndex % activePlayers.length];
      if (nextArtist) speakText(getRandomPhrase('nextArtist', nextArtist.name));
    }

    // ===== パレット切替・描画色 =====
    function togglePaletteWithSE() {
      playButtonSE();
      usePastelColors = !usePastelColors;
      currentPenColor = '#000000';
      renderColorPalette();
      updatePaletteToggleButton();
    }
    function updatePaletteToggleButton() {
      const btn = document.getElementById('palette-toggle-btn');
      if (btn) {
        if (usePastelColors) btn.innerText = '🎨 通常';
        else btn.innerText = '🌸 パステル';
      }
    }
    function renderColorPalette() {
      const container = document.getElementById('color-palette');
      container.innerHTML = '';
      const colors = usePastelColors ? PASTEL_COLORS : PEN_COLORS;
      colors.forEach(c => {
        const btn = document.createElement('button');
        btn.onclick = () => { playButtonSE(); selectPenColor(c.id); };
        const isSelected = currentPenColor === c.id;
        btn.className = `w-5 h-5 rounded-full ${c.bg} border-2 transition ${isSelected ? 'scale-125 border-white ring-2 ring-indigo-400 z-10' : 'border-transparent hover:scale-110 opacity-80'} touch-action-none`;
        container.appendChild(btn);
      });
    }
    function selectPenColor(hexColor) { currentPenColor = hexColor; renderColorPalette(); }

    // ===== 初期化 =====
    window.addEventListener('DOMContentLoaded', () => {
      loadStorageData();
      initCanvas();
      renderColorPalette();
      updatePaletteToggleButton();
      renderTvRankings();
      updateStartGroupDisplay();
      updateHeaderButton();
      window.addEventListener('resize', resizeCanvas);
    });
  </script>
</body>
</html>
