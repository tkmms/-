<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>アテテ！</title>

  <!-- PWA & iOS Safari フルスクリーン対応設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="アテテ！">
  <meta name="theme-color" content="#020617">
  
  <!-- PWA Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"アテテ！","short_name":"アテテ！","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617"}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 全画面バウンス・スクロール・ズームの徹底防止 */
    html, body {
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
    }

    /* キャンバス領域のタッチ操作最適化 */
    canvas {
      touch-action: none;
      cursor: crosshair;
    }

    /* スクロール可能なエリア（モーダル用） */
    .scrollable-content {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    /* FLIP移動アニメーション用スタイル */
    .player-card-move {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ポイント獲得時の光るアニメーション */
    @keyframes scorePop {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.08); filter: brightness(1.6); ring-color: #f59e0b; }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .animate-score-pop {
      animation: scorePop 0.6s ease-out;
    }

    /* 絵文字の数秒ごとのジャンプアニメーション */
    @keyframes periodicJump {
      0%, 80%, 100% { transform: translateY(0); }
      85% { transform: translateY(-15px) scale(1.05); }
      90% { transform: translateY(0); }
      95% { transform: translateY(-8px) scale(1.02); }
    }

    .animate-periodic-jump {
      animation: periodicJump 3s infinite ease-in-out;
    }

    /* Floating Point (+1pt) アニメーション */
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.5); }
      30% { opacity: 1; transform: translateY(-12px) scale(1.3); }
      80% { opacity: 1; transform: translateY(-28px) scale(1); }
      100% { opacity: 0; transform: translateY(-38px) scale(0.8); }
    }

    .float-score-text {
      animation: floatUp 1.2s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body class="h-[100dvh] w-vw flex flex-col justify-between font-sans overflow-hidden relative">

  <!-- ========================================== -->
  <!-- 0. テレビ枠外（iPad画面最上部）のツールコントロール -->
  <!-- 左上に設定ボタン ＆ 「アテテ！」タイトル、右上にカラーパレット -->
  <!-- ========================================== -->
  <header class="absolute top-0.5 left-0 right-0 z-30 px-[5vw] flex items-center justify-between pointer-events-auto">
    <!-- 左側：設定ボタン ＆ 「アテテ！」タイトル -->
    <div class="flex items-center space-x-3">
      <button onclick="openSettingsWithSE()" class="bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3 py-1 rounded-xl text-xs font-bold shadow-lg flex items-center space-x-1 active:scale-95 transition">
        <span>⚙️ 設定</span>
      </button>
      <span class="text-base md:text-lg font-black text-amber-300 tracking-wider drop-shadow">アテテ！</span>
    </div>

    <!-- 右側：カラーパレット & 全消し -->
    <div class="flex items-center space-x-2">
      <div id="color-palette" class="flex items-center space-x-1.5">
        <!-- JSで動的生成 -->
      </div>

      <button onclick="clearCanvasWithSE()" class="px-2.5 py-1 rounded-lg font-bold text-xs bg-rose-900/80 hover:bg-rose-800 text-rose-200 border border-rose-700 active:scale-95 transition shadow">
        🗑️ 全消し
      </button>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- 1. テレビに映るメイン領域 -->
  <!-- ========================================== -->
  <div class="flex-1 flex flex-col pt-[8.5dvh] px-[5vw] pb-[2.5dvh] min-h-0 relative">
    <div class="w-full h-full flex flex-row gap-3 min-h-0">
      
      <!-- テレビ左側：プレイヤーランキング縦並び（スタート前はタップでアーティスト手動変更可能） -->
      <aside id="tv-rankings-container" class="w-44 md:w-56 h-full flex flex-col gap-1.5 shrink-0 relative select-none">
        <!-- JavaScriptで動的生成 -->
      </aside>

      <!-- テレビ中央〜右側：タイマーバー ＆ お絵描きキャンバス（＋スタート前中央巨大スタートボタン） -->
      <main class="flex-1 h-full flex flex-col gap-2 min-h-0 min-w-0 relative">
        
        <!-- YouTube風 タイマープログレスバー -->
        <div class="w-full bg-slate-800/90 rounded-full h-4 overflow-hidden border border-slate-700 relative shrink-0 shadow-inner">
          <div id="timer-progress-bar" class="h-full bg-gradient-to-r from-red-600 via-rose-500 to-amber-500 rounded-full transition-all duration-200 ease-linear w-full"></div>
          <span id="timer-text-overlay" class="absolute inset-0 flex items-center justify-center text-[11px] font-black text-white drop-shadow font-mono">
            01:00
          </span>
        </div>

        <!-- キャンバス容器 -->
        <div id="canvas-container" class="flex-1 w-full relative bg-white rounded-2xl overflow-hidden shadow-2xl border-2 border-slate-800 min-h-0">
          <canvas id="paint-canvas" class="w-full h-full"></canvas>

          <!-- スタート前：キャンバス中央の巨大スタートボタン -->
          <div id="center-start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-20 transition-opacity duration-300">
            <div class="text-center space-y-4">
              <span class="text-xs font-bold tracking-widest text-amber-400 block uppercase">現在のアーティスト</span>
              <div id="center-artist-display" class="flex items-center justify-center space-x-3 bg-slate-900 border-2 border-amber-500/60 px-6 py-4 rounded-3xl shadow-2xl">
                <!-- アーティスト絵文字と名前 -->
              </div>
              <button onclick="toggleGameWithSE()" class="mt-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-4 px-12 rounded-3xl text-2xl md:text-3xl border-4 border-emerald-300 shadow-2xl active:scale-95 transition animate-bounce">
                ▶️ スタート！
              </button>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. テレビには絶対映らない秘密の領域（画面最下部：14dvh固定） -->
  <!-- スタート後は「中断」「パス」「お題」「🎉正解！」が出現 -->
  <!-- ========================================== -->
  <footer class="h-[14dvh] w-full bg-slate-900 border-t-2 border-slate-800 px-4 py-1.5 flex items-center justify-between gap-2 shrink-0 z-20 shadow-2xl overflow-hidden relative">
    
    <!-- 正解者タップ用ヒントガイド -->
    <div class="absolute -top-5 left-6 text-[10px] text-amber-300/80 font-bold tracking-wider pointer-events-none flex items-center space-x-1">
      <span>正解したら右側の「🎉 正解！」ボタンをタップ！</span>
    </div>

    <!-- お題 ＆ コントロールエリア -->
    <div class="w-full bg-amber-500/10 border-2 border-amber-500/50 rounded-2xl px-4 py-1.5 flex items-center justify-between relative shadow-inner h-full overflow-hidden gap-3">
      
      <!-- 左側：中断/パスボタン（スタート後に出現） -->
      <div id="footer-active-controls-left" class="flex items-center space-x-2 shrink-0 opacity-0 pointer-events-none transition-opacity duration-300">
        <button id="btn-start" onclick="toggleGameWithSE()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs md:text-sm border border-rose-400 shadow active:scale-95 transition">
          中断
        </button>
        <button id="btn-skip" onclick="skipWordWithSE()" disabled class="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-white font-bold py-2.5 px-3 rounded-xl text-xs border border-slate-600 active:scale-95 transition">
          パス
        </button>
      </div>

      <!-- 中央：お題表示 -->
      <div class="flex-1 flex items-center justify-center h-full min-w-0 px-3">
        <div id="word-display" class="font-black tracking-wider text-amber-300 text-center truncate w-full" style="font-size: clamp(1.2rem, 3vw, 2.4rem);">
          「スタート」を押してね！
        </div>
      </div>

      <!-- 右側：🎉 正解！ボタン（スタート後に出現） -->
      <div id="footer-active-controls-right" class="flex items-center shrink-0 opacity-0 pointer-events-none transition-opacity duration-300">
        <button id="btn-correct-trigger" onclick="openAnswerModalWithSE()" disabled class="bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-black font-black py-2.5 px-6 rounded-xl text-xs md:text-base border border-amber-300 shadow-lg active:scale-95 transition">
          🎉 正解！
        </button>
      </div>

    </div>
  </footer>


  <!-- ========================================== -->
  <!-- 3. 🎉 正解選択モーダル -->
  <!-- ========================================== -->
  <div id="answer-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
    <div class="bg-slate-900 border-2 border-amber-500/80 rounded-2xl w-full max-w-5xl h-[68vh] flex flex-col shadow-2xl overflow-hidden p-5 space-y-2 relative -top-6">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-2 shrink-0">
        <span class="text-xs md:text-sm font-bold text-amber-400">🎉 正解発表！正解したプレイヤーをタップ</span>
        <span class="text-[11px] text-slate-400">※タップすると+1pt入って次のお題へ！</span>
      </div>

      <div class="flex-1 flex flex-col md:flex-row gap-4 min-h-0 overflow-hidden items-stretch">
        
        <!-- 左エリア：超巨大絵文字 -->
        <div class="w-full md:w-1/2 bg-gradient-to-b from-amber-500/20 to-slate-900/80 border-2 border-amber-500/40 rounded-2xl p-4 flex flex-col items-center justify-center h-full text-center relative overflow-hidden shadow-inner">
          <div id="modal-word-display" class="flex flex-col items-center justify-center h-full w-full">
            <!-- 動的生成 -->
          </div>
        </div>

        <!-- 右エリア：プレイヤー選択 -->
        <div id="answer-modal-grid" class="w-full md:w-1/2 grid grid-cols-3 gap-3 h-full overflow-y-auto p-2">
          <!-- 動的生成 -->
        </div>

      </div>

      <div class="flex justify-end pt-1 border-t border-slate-800 shrink-0">
        <button onclick="closeAnswerModalWithSE()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-6 py-1.5 rounded-xl text-xs font-bold border border-slate-700 active:scale-95 transition">
          キャンセル（ゲーム再開）
        </button>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 4. モーダル：設定＆プレイヤー・お題登録 -->
  <!-- ========================================== -->
  <div id="settings-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[88vh] flex flex-col shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-xl font-bold text-white flex items-center space-x-2">
          <span>⚙️ ゲーム設定＆お題編集</span>
        </h2>
        <button onclick="closeSettingsWithSE()" class="text-slate-400 hover:text-white text-2xl font-bold px-2">✕</button>
      </div>

      <div class="p-6 scrollable-content overflow-y-auto space-y-6 flex-1 text-sm">
        <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-3 gap-2">
          <div class="flex space-x-2">
            <button id="tab-btn-players" onclick="switchTabWithSE('players')" class="px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white">
              👥 プレイヤー編集
            </button>
            <button id="tab-btn-words" onclick="switchTabWithSE('words')" class="px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400">
              📝 お題一括登録（絵文字対応）
            </button>
          </div>

          <label class="flex items-center space-x-2 cursor-pointer bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
            <span class="text-xs text-slate-300 font-bold">🔊 実況音声</span>
            <input type="checkbox" id="speech-toggle" onchange="toggleSpeech(this.checked)" checked class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
          </label>
        </div>

        <div id="tab-content-players" class="space-y-4">
          <div class="flex justify-between items-center">
            <p class="text-slate-400 text-xs">
              プレイヤーの名前、アイコン絵文字、テーマカラーを選択できます（最大9名）。
            </p>
            <button onclick="resetScoresWithSE()" class="text-xs bg-rose-900/50 hover:bg-rose-800 text-rose-300 border border-rose-700 px-3 py-1 rounded">
              スコアをリセット
            </button>
          </div>

          <div id="players-list-container" class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- 動的生成 -->
          </div>
        </div>

        <div id="tab-content-words" class="space-y-3 hidden">
          <div class="bg-indigo-950/60 border border-indigo-500/40 p-3 rounded-xl">
            <span class="text-xs font-bold text-indigo-200 block mb-1">お題の入力形式について</span>
            <p class="text-[11px] text-slate-300">
              「<span class="text-amber-300 font-bold">🎺 トランペット</span>」のように、絵文字と名前をスペース区切りで1行ずつ入力してください。
            </p>
          </div>

          <textarea id="words-input" rows="10" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-mono text-sm focus:outline-none focus:border-indigo-500 leading-relaxed" placeholder="🎺 トランペット&#10;🎻 バイオリン&#10;🎤 マイク&#10;🚗 自動車&#10;⚽ サッカー"></textarea>
          
          <div class="flex justify-between items-center text-xs text-slate-500">
            <span id="words-count-display">現在のお題数: 0個</span>
            <button onclick="loadDefaultWordsWithSE()" class="text-indigo-400 hover:underline font-bold">デフォルトのお題を読み込む</button>
          </div>
        </div>
      </div>

      <div class="p-4 border-t border-slate-800 flex justify-end">
        <button onclick="saveAndCloseSettingsWithSE()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2 rounded-xl shadow-lg">
          設定を保存して閉じる
        </button>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 5. モーダル：「〇〇さんのアート作品」タイムアップ・ギャラリー展示 -->
  <!-- ウィンドウ横幅をさらに狭めてテレビ外はみ出し防止 -->
  <!-- ========================================== -->
  <div id="result-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col justify-between p-4 pt-10">
    
    <div class="bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-amber-500/60 rounded-3xl w-full max-w-5xl h-[68vh] mx-auto flex flex-col p-5 shadow-2xl space-y-3 relative overflow-hidden mt-8">
      
      <div class="flex items-center justify-between border-b border-amber-500/30 pb-3 shrink-0">
        <div class="flex items-center space-x-3">
          <span class="text-3xl">🎨</span>
          <h2 id="result-gallery-title" class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-100 tracking-wider">
            〇〇さんのアート作品
          </h2>
        </div>
        <span class="text-xs font-bold text-amber-400/80 bg-amber-950/80 border border-amber-500/40 px-3 py-1 rounded-full">
          ✨ ラウンド終了
        </span>
      </div>

      <div class="flex-1 flex flex-col md:flex-row gap-4 min-h-0 overflow-hidden">
        
        <!-- 左側：ギャラリー -->
        <div class="w-full md:w-8/12 bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col min-h-0 shadow-inner">
          <h3 class="text-xs font-bold text-amber-300 border-b border-slate-800 pb-1.5 shrink-0 mb-2">🖼️ 展示ギャラリー</h3>
          <div id="result-drawings-gallery" class="flex-1 grid grid-cols-2 md:grid-cols-3 gap-3 scrollable-content overflow-y-auto pr-1">
            <!-- 作品カード挿入 -->
          </div>
        </div>

        <!-- 右側：ランキング -->
        <div class="w-full md:w-4/12 bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col min-h-0 shadow-inner">
          <h3 class="text-xs font-bold text-amber-300 border-b border-slate-800 pb-1.5 shrink-0 mb-2">🏆 ランキング</h3>
          <div id="result-ranking-list" class="flex-1 space-y-2 scrollable-content overflow-y-auto pr-1">
            <!-- 動的生成 -->
          </div>
        </div>

      </div>
    </div>

    <!-- テレビ非表示の画面最下部枠外エリア -->
    <div class="w-full max-w-xl mx-auto py-2 shrink-0">
      <button onclick="closeResultModalWithSE()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-2xl shadow-2xl text-base md:text-lg border-2 border-emerald-400 active:scale-95 transition">
        次のラウンドへ進む ➔
      </button>
    </div>

  </div>


  <!-- JavaScript ロジック -->
  <script>

    function startAudioKeepAlive() {
      if (keepAliveInterval) return;
      keepAliveInterval = setInterval(() => {
        if (!audioCtx || audioCtx.state !== 'running') return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } catch (e) {}
      }, 4000);
    }

    function initPencilSoundNode() {
      if (!audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        pencilNoiseNode = audioCtx.createBufferSource();
        pencilNoiseNode.buffer = noiseBuffer;
        pencilNoiseNode.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800, audioCtx.currentTime);
        filter.Q.setValueAtTime(3.0, audioCtx.currentTime);

        pencilGainNode = audioCtx.createGain();
        pencilGainNode.gain.setValueAtTime(0, audioCtx.currentTime);

        pencilNoiseNode.connect(filter);
        filter.connect(pencilGainNode);
        pencilGainNode.connect(audioCtx.destination);
        pencilNoiseNode.start();
      } catch (e) {
        console.error("Pencil sound error:", e);
      }
    }

    function startPencilSound() {
      if (!pencilGainNode || !audioCtx) return;
      pencilGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pencilGainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
    }

    function stopPencilSound() {
      if (!pencilGainNode || !audioCtx) return;
      pencilGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      pencilGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    }

    function getRandomPhrase(key, p1, p2) {
      const list = VOICE_PHRASES[key];

      return typeof item === 'function' ? item(p1, p2) : item;

    function unlockAudioAndSpeech() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        initPencilSoundNode();
        startAudioKeepAlive();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if ('speechSynthesis' in window && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
    }

    function speakText(text) {

      try {

        uttr.rate = 1.15;
        uttr.pitch = 1.1;

    function parseWordListFromRaw(rawText) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      return lines.map(line => {
        const parts = line.split(/\s+/);
        if (parts.length >= 2) {
          return { emoji: parts[0], name: parts.slice(1).join(' ') };
        } else {
          return { emoji: null, name: line };
        }
      });
    }

    function loadStorageData() {
      let loadedPlayers = localStorage.getItem(STORAGE_KEY_PLAYERS);
      if (!loadedPlayers) {
        for (const oldKey of OLD_PLAYER_KEYS) {
          const oldData = localStorage.getItem(oldKey);
          if (oldData) { loadedPlayers = oldData; break; }
        }

      try {
        if (loadedPlayers) {
          const parsed = JSON.parse(loadedPlayers);
          players = parsed.map((p, idx) => ({
            ...DEFAULT_PLAYERS[idx],
            ...p,
            emoji: EMOJI_OPTIONS.includes(p.emoji) ? p.emoji : DEFAULT_PLAYERS[idx].emoji,
            colorIdx: p.colorIdx !== undefined ? p.colorIdx : (idx % COLOR_OPTIONS.length)
          }));
        } else {
          players = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));

        players = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));

      let loadedWords = localStorage.getItem(STORAGE_KEY_WORDS);
      rawWordInputText = loadedWords ? loadedWords : DEFAULT_WORDS_RAW;
      parsedWordList = parseWordListFromRaw(rawWordInputText);

      try {
        const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
        if (savedSettings) {
          const settings = JSON.parse(savedSettings);
          enableSpeech = settings.enableSpeech !== undefined ? settings.enableSpeech : true;
        }
      } catch (e) {}

      document.getElementById('speech-toggle').checked = enableSpeech;
      saveStorageData();
    }

    function saveStorageData() {

        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify({ enableSpeech }));
      } catch (e) {

      }

    function playSound(type) {
      unlockAudioAndSpeech();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'finish') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(392.00, audioCtx.currentTime);
          osc.frequency.setValueAtTime(261.63, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.6);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function initCanvas() {
      canvas = document.getElementById('paint-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      canvas.addEventListener('pointerdown', startDrawing);
      canvas.addEventListener('pointermove', draw);
      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
    }

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (canvas.width > 0) {
        tempCtx.drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (tempCanvas.width > 0) {
        ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
      }
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    // 描画処理：黒（主線）と白は source-over、他カラーは黒線を消さない destination-over
    function startDrawing(e) {
      unlockAudioAndSpeech();
      isDrawing = true;
      startPencilSound();

      const pos = getCanvasCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      const colorObj = PEN_COLORS.find(c => c.id === currentPenColor);
      ctx.strokeStyle = currentPenColor;

      if (currentPenColor === '#ffffff') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = ERASER_LINE_WIDTH;
      } else if (colorObj && colorObj.isOverlayColor) {
        ctx.globalCompositeOperation = 'destination-over'; // 黒線の下に色を塗る（塗り専用）
        ctx.lineWidth = COLOR_LINE_WIDTH;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = BLACK_LINE_WIDTH;
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasCoordinates(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        ctx.closePath();
        isDrawing = false;
        ctx.globalCompositeOperation = 'source-over';
        stopPencilSound();
      }
    }

    function clearCanvas() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function startGame() {
      if (parsedWordList.length === 0) {
        alert("お題が登録されていません。設定からお題を追加してください。");
        return;
      }

      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length < 1) {
        alert("ゲームに参加するプレイヤーを最低1名以上設定してください。");
        return;
      }

      isGaming = true;
      isPaused = false;
      timerSeconds = 60;
      usedWordIndices.clear();

      roundScores = {};
      roundDrawingsHistory = [];
      players.forEach(p => { roundScores[p.id] = 0; });

      // フッターのコントロール表示切替
      document.getElementById('center-start-overlay').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('footer-active-controls-left').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('footer-active-controls-right').classList.remove('opacity-0', 'pointer-events-none');

      document.getElementById('btn-start').innerText = "中断";
      document.getElementById('btn-start').className = "bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs md:text-sm border border-rose-400 shadow active:scale-95 transition";
      document.getElementById('btn-skip').disabled = false;
      document.getElementById('btn-correct-trigger').disabled = false;

      clearCanvas();
      nextWord();

      const activePlayersList = players.filter(p => p.active);
      const currentArtist = activePlayersList[currentArtistIndex % activePlayersList.length];
      speakText(getRandomPhrase('start', currentArtist ? currentArtist.name : "アーティスト"));

      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (isPaused) return;

        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds === 3) {
          speakText("3");
        } else if (timerSeconds === 2) {
          speakText("2");
        } else if (timerSeconds === 1) {
          speakText("1");
        } else if (timerSeconds === 30) {
          const act = players.filter(p => p.active);
          const art = act[currentArtistIndex % act.length];
          speakText(getRandomPhrase('time30', art ? art.name : "アーティスト"));
        }

        if (timerSeconds <= 0) {
          finishRound();
        }
      }, 1000);
    }

    function stopGame() {
      isGaming = false;
      isPaused = false;
      clearInterval(timerInterval);
      
      // フッターコントロール非表示 ＆ 中央スタートボタン再表示
      document.getElementById('center-start-overlay').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('footer-active-controls-left').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('footer-active-controls-right').classList.add('opacity-0', 'pointer-events-none');

      document.getElementById('btn-start').innerText = "スタート";
      document.getElementById('btn-start').className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-5 rounded-xl text-xs md:text-sm border border-emerald-400 shadow-md active:scale-95 transition";

      document.getElementById('btn-correct-trigger').disabled = true;
      document.getElementById('word-display').innerText = "「スタート」を押してね！";
      updateTimerDisplay(60);
      updateCenterArtistDisplay();
    }

    function finishRound() {
      saveCurrentCanvasToHistory(null, true);
      stopGame();
      playSound('finish');
      
      const activePlayers = players.filter(p => p.active);
      const artist = activePlayers[currentArtistIndex % activePlayers.length];
      const artistRoundPt = artist ? (roundScores[artist.id] || 0) : 0;

      speakText(getRandomPhrase('finishRound', artist ? artist.name : "アーティスト", artistRoundPt));
      showResultModal();

    function updateTimerDisplay(overrideSec) {
      const sec = overrideSec !== undefined ? overrideSec : timerSeconds;
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      
      document.getElementById('timer-text-overlay').innerText = `${mm}:${ss}`;

      const percentage = (sec / 60) * 100;
      document.getElementById('timer-progress-bar').style.width = `${percentage}%`;
    }

    function saveCurrentCanvasToHistory(winnerPlayer, isUnfinished = false) {
      if (!canvas || !currentWordObj) return;
      try {
        const timeTaken = Math.max(1, currentWordStartTime - timerSeconds);
        const dataUrl = canvas.toDataURL('image/png');
        roundDrawingsHistory.push({
          dataUrl,
          wordName: currentWordObj.name,
          wordEmoji: currentWordObj.emoji,
          timeTaken,
          isUnfinished,
          winnerName: winnerPlayer ? winnerPlayer.name : null,
          winnerEmoji: winnerPlayer ? winnerPlayer.emoji : null
        });
      } catch (e) {
        console.error("Canvas save error:", e);
      }
    }

    function nextWord() {
      if (usedWordIndices.size >= parsedWordList.length) {
        usedWordIndices.clear();
      }

      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * parsedWordList.length);
      } while (usedWordIndices.has(randomIndex) && usedWordIndices.size < parsedWordList.length);

      usedWordIndices.add(randomIndex);
      currentWordObj = parsedWordList[randomIndex];
      currentWordStartTime = timerSeconds;
      
      document.getElementById('word-display').innerText = currentWordObj.name;
      clearCanvas();
    }

        btn.className = `p-2 rounded-2xl border-2 flex flex-col items-center justify-between transition active:scale-95 shadow-lg relative ${colorStyle.bg} ${colorStyle.border} ${isArtist ? 'ring-4 ring-amber-400 font-black' : ''}`;

        btn.innerHTML = `
          ${isArtist ? '<span class="absolute top-2 left-2 bg-amber-400 text-black text-[9px] font-black px-2 py-0.5 rounded-full shadow z-30">アーティスト</span>' : ''}
          <span class="text-4xl md:text-5xl my-1 shrink-0 drop-shadow">${player.emoji}</span>
          <span class="text-xs md:text-sm font-extrabold text-white truncate w-full text-center px-1">${player.name}</span>
          <span class="mt-1 text-[11px] font-mono font-bold text-amber-300 bg-black/40 px-2 py-0.5 rounded-full border border-white/20">
            +${currentRoundPt} pt
          </span>
        `;

        grid.appendChild(btn);
      });
    }

    function submitCorrectWinner(winnerPlayerId) {
      if (!isGaming) return;

      const activePlayers = players.filter(p => p.active);
      const artist = activePlayers[currentArtistIndex % activePlayers.length];
      if (artist) {
        artist.score += 1;
        roundScores[artist.id] = (roundScores[artist.id] || 0) + 1;
      }

      const winner = players.find(p => p.id === winnerPlayerId);
      if (winner && winner.id !== artist.id) {
        winner.score += 1;
        roundScores[winner.id] = (roundScores[winner.id] || 0) + 1;
      }

      saveCurrentCanvasToHistory(winner, false);

      if (winner) {
        speakText(getRandomPhrase('afterCorrectWinner', winner.name));
      }

      saveStorageData();
      closeAnswerModal();
      
      renderTvRankingsWithAnimation();
      triggerScoreAnimation(winnerPlayerId, artist ? artist.id : null);
      nextWord();
    }

    function triggerScoreAnimation(winnerId, artistId) {
      const idsToAnimate = new Set([winnerId, artistId].filter(id => id !== null));
      
      idsToAnimate.forEach(id => {
        const card = document.getElementById(`player-card-${id}`);
        if (card) {
          card.classList.add('animate-score-pop');
          
          const floatEl = document.createElement('div');
          floatEl.className = 'absolute inset-0 flex items-center justify-center font-black text-amber-300 text-xl md:text-2xl drop-shadow-lg float-score-text z-30';
          floatEl.innerText = '+1 pt!';
          card.appendChild(floatEl);

          setTimeout(() => {
            card.classList.remove('animate-score-pop');
            if (floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
          }, 1200);
        }
      });
    }

    function renderTvRankingsWithAnimation() {
      const container = document.getElementById('tv-rankings-container');
      
      const children = Array.from(container.children);
      children.forEach(child => {
        const id = child.id;
        if (id) { previousPositions.set(id, child.getBoundingClientRect()); }
      });

      renderTvRankings();

      const newChildren = Array.from(container.children);
      newChildren.forEach(child => {
        const id = child.id;
        const first = previousPositions.get(id);
        if (first) {
          const last = child.getBoundingClientRect();
          const deltaY = first.top - last.top;

          if (deltaY !== 0) {
            child.style.transform = `translateY(${deltaY}px)`;
            child.style.transition = 'none';

            requestAnimationFrame(() => {
              child.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
              child.style.transform = '';
            });
          }
        }
      });
    }

    function renderTvRankings() {
      const container = document.getElementById('tv-rankings-container');
      container.innerHTML = '';

      const activePlayers = players.filter(p => p.active);
      if (activePlayers.length === 0) return;

      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];

      const sorted = activePlayers.map((p, originalIndex) => ({
        ...p,
        originalIndex
      })).sort((a, b) => b.score - a.score || a.id - b.id);

      let currentRank = 1;
      const rankedPlayers = sorted.map((player, idx, arr) => {
        if (idx > 0 && player.score < arr[idx - 1].score) {
          currentRank = idx + 1;
        }
        return { ...player, displayRank: currentRank };
      });

      rankedPlayers.forEach((player) => {
        const colorStyle = COLOR_OPTIONS[player.colorIdx % COLOR_OPTIONS.length] || COLOR_OPTIONS[0];
        const isArtist = currentArtist && currentArtist.id === player.id;
        const rank = player.displayRank;

        const card = document.createElement('div');
        card.id = `player-card-${player.id}`;
        
        if (!isGaming) {
          card.onclick = () => selectArtistByCardTap(player.id);
          card.style.cursor = 'pointer';
        }

        card.className = `player-card-move w-full flex-1 rounded-xl p-2 flex items-center justify-between border-2 transition relative overflow-hidden shadow-md ${colorStyle.bg} ${colorStyle.border} ${isArtist ? 'ring-4 ring-amber-400 font-black' : 'opacity-90'}`;

        let rankBadge = `<span class="text-xs font-bold w-6 text-center text-white/90">${rank}位</span>`;
        if (rank === 1) rankBadge = `<span class="text-sm font-black w-6 text-center">🥇</span>`;
        if (rank === 2) rankBadge = `<span class="text-sm font-black w-6 text-center">🥈</span>`;
        if (rank === 3) rankBadge = `<span class="text-sm font-black w-6 text-center">🥉</span>`;

        card.innerHTML = `
          ${isArtist ? '<span class="absolute top-0 right-0 bg-amber-400 text-black text-[8px] font-black px-1.5 py-0.2 rounded-bl-md shadow z-30">アーティスト</span>' : ''}
          <div class="flex items-center space-x-1.5 truncate flex-1 min-w-0 pr-1">
            ${rankBadge}
            <span class="text-xl md:text-2xl leading-none shrink-0 drop-shadow-sm">${player.emoji}</span>
            <span class="text-xs md:text-sm font-extrabold text-white truncate">${player.name}</span>
          </div>
          <div class="text-right shrink-0">
            <span class="text-sm md:text-base font-black text-white font-mono bg-black/30 px-1.5 py-0.5 rounded border border-white/20">${player.score} <span class="text-[9px]">pt</span></span>
          </div>
        `;

        container.appendChild(card);
      });

      updateCenterArtistDisplay();
    }

    function updateCenterArtistDisplay() {
      const activePlayers = players.filter(p => p.active);
      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];
      const displayEl = document.getElementById('center-artist-display');
      if (displayEl && currentArtist) {
        displayEl.innerHTML = `
          <span class="text-5xl md:text-6xl">${currentArtist.emoji}</span>
          <span class="text-xl md:text-2xl font-black text-white">${currentArtist.name}</span>
        `;
      }
    }

    function selectArtistByCardTap(playerId) {
      if (isGaming) return;
      playButtonSE();

      const activePlayers = players.filter(p => p.active);
      const idx = activePlayers.findIndex(p => p.id === playerId);
      if (idx !== -1) {
        currentArtistIndex = idx;
        renderTvRankings();

        const selectedPlayer = activePlayers[idx];
        speakText(getRandomPhrase('selectArtistManual', selectedPlayer.name));
      }
    }

    function openSettings() {
      if (isGaming) stopGame();

      renderPlayersSettingsList();
      document.getElementById('words-input').value = rawWordInputText;
      updateWordsCountDisplay();
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveAndCloseSettings() {
      const rawText = document.getElementById('words-input').value;
      const parsed = parseWordListFromRaw(rawText);
      
      if (parsed.length === 0) {
        alert("お題は最低1つ以上入力してください。");
        return;
      }

      rawWordInputText = rawText;
      parsedWordList = parsed;

      const activePlayers = players.filter(p => p.active);
      if (currentArtistIndex >= activePlayers.length) {
        currentArtistIndex = 0;
      }

      saveStorageData();
      renderTvRankings();
      closeSettings();
    }

    function switchTab(tabName) {
      const tabPlayers = document.getElementById('tab-content-players');
      const tabWords = document.getElementById('tab-content-words');
      const btnPlayers = document.getElementById('tab-btn-players');
      const btnWords = document.getElementById('tab-btn-words');

      if (tabName === 'players') {
        tabPlayers.classList.remove('hidden');
        tabWords.classList.add('hidden');
        btnPlayers.className = "px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white";
        btnWords.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400";
      } else {
        tabPlayers.classList.add('hidden');
        tabWords.classList.remove('hidden');
        btnPlayers.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400";
        btnWords.className = "px-4 py-2 rounded-lg font-bold bg-indigo-600 text-white";
      }
    }

    function renderPlayersSettingsList() {
      const container = document.getElementById('players-list-container');
      container.innerHTML = '';

      const activePlayers = players.filter(p => p.active);

      players.forEach((player) => {
        const activeIdx = activePlayers.findIndex(p => p.id === player.id);
        const isArtist = activeIdx === (currentArtistIndex % (activePlayers.length || 1));

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex flex-col justify-between space-y-2 bg-slate-950 ${player.active ? 'border-slate-700' : 'border-slate-800 opacity-50'}`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-slate-300 text-xs">P${player.id + 1}</span>
            <label class="flex items-center cursor-pointer space-x-1">
              <span class="text-[10px] text-slate-400">${player.active ? '参加' : 'お休み'}</span>
              <input type="checkbox" ${player.active ? 'checked' : ''} onchange="togglePlayerActive(${player.id})" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
            </label>
          </div>

          <div class="flex space-x-2">
            <select onchange="updatePlayerEmoji(${player.id}, this.value)" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-lg text-white focus:outline-none">
              ${EMOJI_OPTIONS.map(e => `<option value="${e}" ${e === player.emoji ? 'selected' : ''}>${e}</option>`).join('')}
            </select>
            <input type="text" value="${player.name}" onchange="updatePlayerName(${player.id}, this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white text-xs focus:outline-none focus:border-indigo-500" placeholder="名前">
          </div>

          <div class="space-y-1">
            <span class="text-[10px] text-slate-400 block">テーマカラー:</span>
            <div class="flex flex-wrap gap-1">
              ${COLOR_OPTIONS.map((c, i) => `
                <button onclick="updatePlayerColor(${player.id}, ${i})" class="w-4 h-4 rounded-full ${c.bg} border ${i === player.colorIdx ? 'border-white ring-2 ring-indigo-400 scale-110 z-10' : 'border-transparent opacity-70 hover:opacity-100'}"></button>
              `).join('')}
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs">
            <span class="font-mono text-amber-400 font-bold">${player.score} pt</span>
            ${player.active ? `
              <button onclick="setArtistByPlayerId(${player.id})" class="px-2 py-0.5 rounded text-[10px] font-bold ${isArtist ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">
                ${isArtist ? '★ アーティスト' : 'アーティストに指定'}
              </button>
            ` : '<span></span>'}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function togglePlayerActive(playerId) {
      playButtonSE();
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.active = !p.active;
        saveStorageData();
        renderPlayersSettingsList();
      }
    }

    function updatePlayerName(playerId, newName) {
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.name = newName.trim() || `プレイヤー${playerId + 1}`;
        saveStorageData();
      }
    }

    function updatePlayerEmoji(playerId, emoji) {
      playButtonSE();
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.emoji = emoji;
        saveStorageData();
      }
    }

    function updatePlayerColor(playerId, colorIdx) {
      playButtonSE();
      const p = players.find(x => x.id === playerId);
      if (p) {
        p.colorIdx = colorIdx;
        saveStorageData();
        renderPlayersSettingsList();
      }
    }

    function setArtistByPlayerId(playerId) {
      playButtonSE();
      const activePlayers = players.filter(p => p.active);
      const idx = activePlayers.findIndex(p => p.id === playerId);
      if (idx !== -1) {
        currentArtistIndex = idx;
        renderPlayersSettingsList();
      }
    }

    function resetScoresWithSE() {
      playButtonSE();
      resetScores();
    }

    function resetScores() {
      if (confirm("全員のスコアを 0 pt にリセットしますか？")) {
        players.forEach(p => p.score = 0);
        roundScores = {};
        saveStorageData();
        renderPlayersSettingsList();
        renderTvRankings();
      }
    }

    function loadDefaultWordsWithSE() {
      playButtonSE();
      loadDefaultWords();
    }

    function loadDefaultWords() {
      document.getElementById('words-input').value = DEFAULT_WORDS_RAW;
      updateWordsCountDisplay();
    }

    function updateWordsCountDisplay() {
      const rawText = document.getElementById('words-input').value;
      const parsed = parseWordListFromRaw(rawText);
      document.getElementById('words-count-display').innerText = `現在のお題数: ${parsed.length}個`;
    }

    document.getElementById('words-input').addEventListener('input', updateWordsCountDisplay);

    // お気に入り作品のスクエア画像保存（項目名ラベル廃止・上お題、中央絵画、下アーティスト大・年月日時分＋秒数）
    function saveDrawingAsImage(dataUrl, wordName, artistName, timeTaken) {
      playButtonSE();
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 1080;
        c.height = 1080;
        const cx = c.getContext('2d');

        const grad = cx.createLinearGradient(0, 0, 0, 1080);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(1, '#1e1b4b');
        cx.fillStyle = grad;
        cx.fillRect(0, 0, 1080, 1080);

        // 上部中央：お題（ラベルなし）
        cx.fillStyle = '#fef3c7';
        cx.font = 'bold 48px sans-serif';
        cx.textAlign = 'center';
        cx.fillText(`${wordName}`, 540, 85);

        // 中央：キャンバス（正方形枠）
        cx.fillStyle = '#ffffff';
        cx.roundRect(90, 110, 900, 780, 24);
        cx.fill();
        cx.drawImage(img, 110, 130, 860, 740);

        // 下部中央：アーティスト名（ラベルなし・大サイズ）
        cx.fillStyle = '#fbbf24';
        cx.font = 'bold 44px sans-serif';
        cx.textAlign = 'center';
        cx.fillText(`${artistName}`, 540, 955);

        // 最下部：年月日時分 ＆ 所要時間（縦線なし）
        const now = new Date();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日(${days[now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}  所要時間 ${timeTaken}秒`;
        
        cx.fillStyle = '#94a3b8';
        cx.font = '22px sans-serif';
        cx.fillText(dateStr, 540, 1015);

        const link = document.createElement('a');
        link.download = `${wordName}_${artistName}.png`;
        link.href = c.toDataURL('image/png');
        link.click();
      };
      img.src = dataUrl;
    }

    // タイムアップギャラリー表示（ウィンドウ横幅を少し狭める ＆ ランキング0ptは薄く）
    function showResultModal() {
      const list = document.getElementById('result-ranking-list');
      const gallery = document.getElementById('result-drawings-gallery');
      const galleryTitle = document.getElementById('result-gallery-title');
      
      list.innerHTML = '';
      gallery.innerHTML = '';

      const activePlayers = players.filter(p => p.active);
      const currentArtist = activePlayers[currentArtistIndex % activePlayers.length];
      const artistName = currentArtist ? currentArtist.name : "アーティスト";

      if (galleryTitle) {
        galleryTitle.innerText = `${artistName}さんのアート作品`;
      }

      const detectives = activePlayers.filter(p => !currentArtist || p.id !== currentArtist.id);
      const roundRanked = detectives.map(p => ({
        ...p,
        roundScore: roundScores[p.id] || 0
      })).sort((a, b) => b.roundScore - a.roundScore || b.id - a.id);

      let currentRank = 1;
      const rankedRoundDetectives = roundRanked.map((player, idx, arr) => {
        if (idx > 0 && player.roundScore < arr[idx - 1].roundScore) {
          currentRank = idx + 1;
        }
        return { ...player, displayRank: currentRank };
      });

      rankedRoundDetectives.forEach((player) => {
        const item = document.createElement('div');
        const isZero = player.roundScore === 0;
        item.className = `flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-sm transition ${isZero ? 'opacity-40' : 'opacity-100'}`;
        
        let rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">${player.displayRank}位</span>`;
        if (player.displayRank === 1) rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">🥇 1位</span>`;
        if (player.displayRank === 2) rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">🥈 2位</span>`;
        if (player.displayRank === 3) rankBadge = `<span class="font-bold text-xs text-amber-400 w-10 text-left">🥉 3位</span>`;

        item.innerHTML = `
          <div class="flex items-center space-x-1.5 truncate">
            ${rankBadge}
            <span class="text-lg">${player.emoji}</span>
            <span class="text-white font-bold text-xs truncate max-w-[80px]">${player.name}</span>
          </div>
          <div class="text-right font-mono font-black ${isZero ? 'text-slate-500' : 'text-amber-300'} text-xs shrink-0">
            +${player.roundScore} <span class="text-[9px] text-slate-400">(累計${player.score}pt)</span>
          </div>
        `;
        list.appendChild(item);
      });

      if (roundDrawingsHistory.length === 0) {
        gallery.innerHTML = `<div class="col-span-3 text-slate-500 text-xs py-12 text-center w-full">このラウンドで描かれた作品はありません</div>`;
      } else {
        roundDrawingsHistory.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = "bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-amber-500/30 rounded-xl p-2 flex flex-col items-center space-y-1.5 text-center shadow-lg relative";
          
          card.innerHTML = `
            <div class="w-full h-24 md:h-28 bg-white rounded-lg overflow-hidden border-2 border-slate-800 shadow-inner flex items-center justify-center p-1 relative">
              <img src="${item.dataUrl}" class="max-w-full max-h-full object-contain">
            </div>
            <div class="w-full flex items-center justify-between px-1">
              <div class="text-xs font-black text-amber-300 truncate flex items-center space-x-1">
                ${item.wordEmoji ? `<span class="text-sm">${item.wordEmoji}</span>` : ''}
                <span>${item.wordName}</span>
              </div>
              <div class="flex items-center space-x-1 shrink-0">
                <span class="text-[10px] font-mono bg-amber-500/20 text-amber-300 px-1 py-0.2 rounded border border-amber-500/30">
                  ${item.timeTaken}秒
                </span>
                <button onclick="saveDrawingAsImage('${item.dataUrl}', '${item.wordName}', '${artistName}', ${item.timeTaken})" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow border border-indigo-400 active:scale-95 transition">
                  📥
                </button>
              </div>
            </div>
            <div class="text-[10px] text-slate-400 truncate w-full text-center border-t border-slate-800/80 pt-1">
              ${item.winnerName ? `<span class="text-emerald-400 font-bold">🎉 正解: ${item.winnerEmoji || ''}${item.winnerName}</span>` : '<span class="text-slate-500">（途中作品 / 未完成）</span>'}
            </div>
          `;
          gallery.appendChild(card);

          if (index === roundDrawingsHistory.length - 1 && item.isUnfinished) {
            speakText(getRandomPhrase('unfinishedComment', artistName));
          } else {
            speakText(getRandomPhrase('drawingTimeComment', artistName, item.timeTaken));
          }
        });
      }

      if (activePlayers.length > 0) {
        currentArtistIndex = (currentArtistIndex + 1) % activePlayers.length;
        renderTvRankings();
      }

      document.getElementById('result-modal').classList.remove('hidden');
    }

    function closeResultModalWithSE() {
      playButtonSE();
      closeResultModal();
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.add('hidden');

      const activePlayers = players.filter(p => p.active);
      const nextArtist = activePlayers[currentArtistIndex % activePlayers.length];
      if (nextArtist) {
        speakText(getRandomPhrase('nextArtist', nextArtist.name));
      }
    }
  </script>
</body>
</html>
